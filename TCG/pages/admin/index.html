<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TCG · Admin Check</title>
  <style>
    :root{--bg:#04060a;--bg2:#070d14;--cyan:#00f5c4;--red:#ff2d4e;--amber:#f0a500;--green:#22c55e;--muted:#3a6655;--border:#0e2a1f;--fg:#c8ffe8;--font:'Courier New',monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px}
    body{padding:24px}
    h1{font-size:18px;letter-spacing:.2em;color:var(--cyan);margin-bottom:4px}
    .sub{color:var(--muted);font-size:11px;margin-bottom:24px;letter-spacing:.1em}
    .section{margin-bottom:28px}
    .section-title{font-size:11px;letter-spacing:.18em;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:10px;text-transform:uppercase}
    .row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #0a1810}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .ok  {background:var(--green);box-shadow:0 0 6px var(--green)}
    .err {background:var(--red);box-shadow:0 0 6px var(--red)}
    .warn{background:var(--amber);box-shadow:0 0 6px var(--amber)}
    .pend{background:var(--muted);animation:blink 1s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .label{flex:1;color:var(--fg)}
    .detail{font-size:11px;color:var(--muted);text-align:right;max-width:360px;word-break:break-all}
    .btn-refresh{margin-top:16px;background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:6px 18px;cursor:pointer;font-family:var(--font);font-size:12px;letter-spacing:.1em}
    .btn-refresh:hover{background:var(--cyan);color:#000}
    #summary{margin-top:20px;padding:10px 14px;border:1px solid var(--border);background:var(--bg2);font-size:12px;letter-spacing:.08em}
  </style>
</head>
<body>
  <h1>⬡ TCG · ADMIN CHECK</h1>
  <div class="sub">Diagnostic automatique · <span id="ts"></span></div>

  <div class="section">
    <div class="section-title">🔐 Authentification</div>
    <div id="checks-auth"></div>
  </div>

  <div class="section">
    <div class="section-title">🗄️ Tables Supabase</div>
    <div id="checks-db"></div>
  </div>

  <div class="section">
    <div class="section-title">📦 Modules JS critiques</div>
    <div id="checks-js"></div>
  </div>

  <div class="section">
    <div class="section-title">🖼️ Assets packs</div>
    <div id="checks-assets"></div>
  </div>

  <button class="btn-refresh" onclick="location.reload()">↺ Relancer</button>
  <div id="summary">Analyse en cours…</div>

<script type="module">
import { supabase as sb } from '/shared/supabase-client.js';
import { getUser } from '/shared/auth.js';
import { getProfile, getDisplayNameFromUser } from '/shared/profile.js';

const SUPA_URL = 'https://imryukpbtkngsihxfxox.supabase.co';
document.getElementById('ts').textContent = new Date().toLocaleString('fr-FR');

let okCount = 0, errCount = 0, warnCount = 0;

function addRow(containerId, label, status, detail = '') {
  if (status === 'ok')   okCount++;
  if (status === 'err')  errCount++;
  if (status === 'warn') warnCount++;
  const el = document.getElementById(containerId);
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = `<span class="dot ${status}"></span><span class="label">${label}</span><span class="detail">${detail}</span>`;
  el.appendChild(div);
}

function addPending(containerId, label) {
  const el = document.getElementById(containerId);
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = `<span class="dot pend"></span><span class="label">${label}</span><span class="detail">…</span>`;
  el.appendChild(div);
  return {
    ok:   (d = '') => _resolve(div, 'ok',   label, d),
    err:  (d = '') => _resolve(div, 'err',  label, d),
    warn: (d = '') => _resolve(div, 'warn', label, d),
  };
}

function _resolve(div, status, label, detail) {
  if (status === 'ok')   okCount++;
  if (status === 'err')  errCount++;
  if (status === 'warn') warnCount++;
  div.innerHTML = `<span class="dot ${status}"></span><span class="label">${label}</span><span class="detail">${detail}</span>`;
}

async function checkAuth() {
  addRow('checks-auth', 'Client Supabase', 'ok', SUPA_URL);
  const p = addPending('checks-auth', 'Session agent');
  try {
    const user = await getUser();
    if (!user) {
      p.warn('Non connecté — <a href="/login.html" style="color:var(--cyan)">Se connecter</a>');
      return;
    }
    const profile = await getProfile(user.id);
    const displayName = getDisplayNameFromUser(user, profile);
    p.ok(`👤 ${displayName}`);
  } catch(e) { p.err(e.message); }
}

async function checkDB() {
  const TABLES = ['tcg_players','tcg_player_packs','tcg_player_cards','tcg_leaderboard','pack_types','profiles'];
  for (const t of TABLES) {
    const p = addPending('checks-db', t);
    try {
      const { count, error } = await sb.from(t).select('*', { count: 'exact', head: true });
      if (error) p.err(error.message);
      else p.ok(`${count ?? '?'} lignes`);
    } catch(e) { p.err(e.message); }
  }
}

async function checkJS() {
  const MODULES = [
    '/TCG/logic/supaRaw.js',
    '/TCG/data/supabaseData.js',
    '/TCG/data/packsRepo.js',
    '/TCG/data/playersRepo.js',
    '/TCG/shared/supabaseClient.js',
    '/shared/supabase-client.js',
    '/shared/auth.js',
    '/shared/profile.js',
    '/TCG/app/router.js',
    '/TCG/app/ui-shell.js',
    '/TCG/pages/shopPage.js',
    '/TCG/pages/packsPage.js',
    '/TCG/pages/openingRenderer.js',
  ];
  for (const path of MODULES) {
    const p = addPending('checks-js', path);
    try {
      const r = await fetch(path, { method: 'HEAD' });
      if (r.ok) p.ok(`HTTP ${r.status}`);
      else p.err(`HTTP ${r.status}`);
    } catch(e) { p.err(e.message); }
  }
}

async function checkAssets() {
  let paths = [];
  try {
    const { data } = await sb.from('pack_types').select('image_name').not('image_name', 'is', null);
    paths = [...new Set((data || []).map(r => `/TCG/assets/packs/${r.image_name}`))];
  } catch(e) {
    addRow('checks-assets', 'pack_types fetch', 'err', e.message);
    return;
  }
  if (!paths.length) { addRow('checks-assets', 'pack_types', 'warn', 'Aucun image_name en DB'); return; }
  for (const path of paths) {
    const p = addPending('checks-assets', path);
    try {
      const r = await fetch(path, { method: 'HEAD' });
      if (r.ok) p.ok(`HTTP ${r.status}`);
      else p.err(`HTTP ${r.status}`);
    } catch(e) { p.err(e.message); }
  }
}

await Promise.all([checkAuth(), checkDB(), checkJS(), checkAssets()]);

const sumEl = document.getElementById('summary');
if (errCount === 0 && warnCount === 0) {
  sumEl.style.borderColor = 'var(--green)';
  sumEl.textContent = `✅ Tout OK — ${okCount} checks passés`;
} else {
  sumEl.style.borderColor = errCount > 0 ? 'var(--red)' : 'var(--amber)';
  sumEl.textContent = `${errCount > 0 ? '❌' : '⚠️'} ${errCount} erreur(s) · ${warnCount} avertissement(s) · ${okCount} OK`;
}
</script>
</body>
</html>
