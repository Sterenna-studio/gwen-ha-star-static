<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Réinitialiser mon mot de passe</title>
  <link rel="stylesheet" href="shared/cyberpunk.css">
</head>
<body>
  <div class="container">
    <h1>🔄 Réinitialisation du mot de passe</h1>
    <div class="card">
      <label>Ton adresse email :</label><br>
      <input type="email" id="email" placeholder="exemple@domaine.com"><br>
      <button onclick="resetPassword()">Envoyer le lien</button>
      <p id="status"></p>
    </div>
  </div>

  <script type="module">
    import { supabase } from './shared/supabaseClient.js';

    async function resetPassword() {
      const email = document.getElementById('email').value;
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://nitro.sterenna.fr/old-gwen/modification_profil.html'
      });

      const status = document.getElementById('status');
      if (error) {
        status.innerText = error.message;
      } else {
        status.innerText = 'Lien de réinitialisation envoyé à ' + email;
      }
    }

    window.resetPassword = resetPassword;
  </script>
</body>
</html>
