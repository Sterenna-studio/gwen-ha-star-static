<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion • STERENNA</title>
  <link rel="stylesheet" href="shared/cyberpunk.css">
  <style>
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #111;
      padding: 0.5rem;
      border-top: 2px solid #0ff;
      display: flex;
      justify-content: space-around;
      font-family: monospace;
      z-index: 1000;
    }
    .nav a {
      color: #0ff;
      text-decoration: none;
      font-weight: bold;
    }
    .nav a:hover {
      text-shadow: 0 0 5px #0ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Connexion à STERENNA</h1>
    <div class="card">
      <label>Email :</label><br>
      <input type="email" id="email"><br>
      <label>Mot de passe :</label><br>
      <input type="password" id="password"><br>
      <button onclick="login()">🔓 Se connecter</button><br>
      <p><a href="reset_password.html" style="color:#0ff;">❓ Mot de passe oublié</a></p>
      <p id="status"></p>
    </div>
  </div>

  <div class="nav">
    <a href="index.html">🏠 Accueil</a>
    <a href="signup.html">🆕 Créer un profil</a>
  </div>

  <script type="module">
    import { supabase } from './shared/supabaseClient.js'

    async function login() {
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const { error } = await supabase.auth.signInWithPassword({ email, password })
      const status = document.getElementById('status')
      if (error) {
        status.innerText = "❌ " + error.message
      } else {
        status.innerText = "✅ Connexion réussie, redirection..."
        setTimeout(() => window.location.href = 'profil.html', 1000)
      }
    }

    window.login = login
  </script>
</body>
</html>
