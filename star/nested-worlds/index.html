<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nested Worlds</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 35%, #172449 0%, #070a16 48%, #02030a 100%); color: #eaf7ff; }
    main { width: min(960px, 94vw); display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 270px; align-items: center; }
    canvas { width: 100%; aspect-ratio: 1; max-height: 78vh; border: 1px solid #2a4266; border-radius: 18px; background: #030611; box-shadow: 0 0 80px #3974ff24; }
    aside { padding: 18px; border: 1px solid #2a4266; border-radius: 14px; background: #09101fe8; }
    h1 { margin: 0 0 6px; font-size: 1.2rem; letter-spacing: .08em; }
    p { color: #9cb5d2; line-height: 1.45; font-size: .86rem; }
    label { display: block; margin-top: 15px; color: #a9c9ed; font-size: .75rem; letter-spacing: .1em; }
    input { width: 100%; margin-top: 7px; padding: 10px; color: #eefaff; border: 1px solid #365b89; border-radius: 7px; background: #050a14; font: inherit; }
    button { cursor: pointer; width: 100%; margin-top: 9px; padding: 10px; border: 1px solid #598bce; border-radius: 7px; background: #122b51; color: #eaf7ff; font: inherit; }
    button:hover { background: #1b3d70; }
    .readout { margin-top: 18px; padding-top: 14px; border-top: 1px solid #294464; color: #cde4ff; font-size: .8rem; line-height: 1.75; }
    .accent { color: #72e6ff; }
    @media (max-width: 720px) { body { overflow: auto; padding: 18px 0; } main { grid-template-columns: 1fr; } canvas { max-height: none; } }
  </style>
</head>
<body>
  <main>
    <canvas id="scene" width="720" height="720" aria-label="Planète procédurale animée"></canvas>
    <aside>
      <h1>NESTED WORLDS</h1>
      <p>Chaque nom crée une planète stable. Les boucles imbriquées deviennent ses courants, son atmosphère et ses phénomènes.</p>
      <label for="seed">DÉSIGNATION PLANÉTAIRE</label>
      <input id="seed" value="STERENNA-01" autocomplete="off">
      <button id="explore">EXPLORER</button>
      <button id="random">SIGNAL ALÉATOIRE</button>
      <label for="temperature">TEMPÉRATURE <span id="tempValue">18</span> °C</label>
      <input id="temperature" type="range" min="-80" max="120" value="18">
      <div class="readout" id="readout"></div>
    </aside>
  </main>
  <script>
    const canvas = document.querySelector('#scene');
    const ctx = canvas.getContext('2d');
    const seedInput = document.querySelector('#seed');
    const temperature = document.querySelector('#temperature');
    const tempValue = document.querySelector('#tempValue');
    const readout = document.querySelector('#readout');
    let planet;

    function hash(value) {
      let h = 1779033703 ^ value.length;
      for (let i = 0; i < value.length; i++) h = Math.imul(h ^ value.charCodeAt(i), 3432918353);
      h = (h ^ h >>> 16) >>> 0;
      return h;
    }
    function mulberry32(a) {
      return () => {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function pick(rng, list) { return list[Math.floor(rng() * list.length)]; }
    function makePlanet(seed) {
      const rng = mulberry32(hash(seed.trim().toUpperCase() || 'UNKNOWN'));
      const types = [
        ['OCÉANIQUE', ['#061b41', '#087e8b', '#1ad1c1', '#bfffee']],
        ['VOLCANIQUE', ['#210712', '#6e1022', '#ea4a25', '#ffd166']],
        ['CRYOGÉNIQUE', ['#061326', '#174b78', '#92dce5', '#f3feff']],
        ['GAZEUSE', ['#1b123b', '#7047a6', '#d884c9', '#ffe0a9']],
        ['MINÉRALE', ['#1a1420', '#55506f', '#bca47a', '#f3e8c8']]
      ];
      const [type, palette] = pick(rng, types);
      return {
        seed: seed.trim().toUpperCase() || 'UNKNOWN', type, palette, rng,
        bands: 4 + Math.floor(rng() * 8),
        moons: Math.floor(rng() * 4),
        rings: rng() > .72,
        rotation: .2 + rng() * 1.3,
        cloudSpeed: .3 + rng() * 1.8,
        phase: rng() * Math.PI * 2,
        lifeMin: Math.floor(rng() * 80) - 40,
        lifeSpan: 12 + Math.floor(rng() * 42)
      };
    }
    function updateReadout() {
      const t = Number(temperature.value);
      tempValue.textContent = t;
      const alive = t >= planet.lifeMin && t <= planet.lifeMin + planet.lifeSpan;
      readout.innerHTML = `MONDE : <span class="accent">${planet.seed}</span><br>TYPE : ${planet.type}<br>LUNES : ${planet.moons}<br>ANNEAUX : ${planet.rings ? 'DÉTECTÉS' : 'ABSENTS'}<br>BIOSIGNAL : <span class="accent">${alive ? 'ACTIF' : 'SILENCIEUX'}</span>`;
    }
    function explore() {
      planet = makePlanet(seedInput.value);
      const url = new URL(location.href);
      url.searchParams.set('seed', planet.seed);
      history.replaceState({}, '', url);
      updateReadout();
    }
    function randomSeed() {
      const syllables = ['NE', 'ST', 'OR', 'KA', 'LY', 'RA', 'VEX', 'ION', 'UM', 'TI'];
      const value = Array.from({ length: 3 + Math.floor(Math.random() * 2) }, () => pick(Math.random, syllables)).join('') + '-' + Math.floor(Math.random() * 999);
      seedInput.value = value;
      explore();
    }
    function draw(time) {
      requestAnimationFrame(draw);
      const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2, r = 238;
      const p = planet;
      ctx.clearRect(0, 0, w, h);
      const stars = mulberry32(hash(p.seed + 'stars'));
      ctx.fillStyle = '#dff4ff';
      for (let i = 0; i < 125; i++) {
        const x = stars() * w, y = stars() * h, a = .15 + stars() * .65;
        ctx.globalAlpha = a; ctx.fillRect(x, y, 1 + stars() * 2, 1 + stars() * 2);
      }
      ctx.globalAlpha = 1;
      if (p.rings) {
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(-.25);
        ctx.strokeStyle = p.palette[3] + '88'; ctx.lineWidth = 16;
        ctx.beginPath(); ctx.ellipse(0, 0, r * 1.46, r * .42, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
      const base = ctx.createRadialGradient(cx - r * .34, cy - r * .38, r * .04, cx, cy, r * 1.15);
      base.addColorStop(0, p.palette[3]); base.addColorStop(.35, p.palette[2]); base.addColorStop(.72, p.palette[1]); base.addColorStop(1, p.palette[0]);
      ctx.fillStyle = base; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      for (let i = 0; i < p.bands; i++) {
        const y = cy - r + ((i + .5) / p.bands) * r * 2;
        const phase = time * .00035 * p.rotation + p.phase + i * 1.73;
        ctx.strokeStyle = p.palette[(i % 3) + 1] + '66'; ctx.lineWidth = r * (.05 + (i % 3) * .016);
        ctx.beginPath();
        for (let x = cx - r; x <= cx + r; x += 6) {
          const wave = Math.sin((x / r) * 5 + phase) * (8 + i * 2) + Math.sin((x / r) * 12 - phase * 1.6) * 5;
          x === cx - r ? ctx.moveTo(x, y + wave) : ctx.lineTo(x, y + wave);
        }
        ctx.stroke();
      }
      for (let i = 0; i < 9; i++) {
        const a = time * .0005 * p.cloudSpeed + p.phase + i * .72;
        const x = cx + Math.cos(a) * r * (.2 + (i % 3) * .24);
        const y = cy + Math.sin(a * 1.37) * r * (.18 + (i % 4) * .16);
        ctx.fillStyle = p.palette[3] + '25';
        ctx.beginPath(); ctx.ellipse(x, y, 24 + (i % 3) * 15, 8 + (i % 2) * 10, a, 0, Math.PI * 2); ctx.fill();
      }
      const shadow = ctx.createLinearGradient(cx - r, cy, cx + r, cy);
      shadow.addColorStop(.35, '#00000000'); shadow.addColorStop(1, '#000000c9');
      ctx.fillStyle = shadow; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      ctx.restore();
      ctx.strokeStyle = p.palette[3] + '99'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < p.moons; i++) {
        const a = time * .0002 * (.5 + i * .21) + p.phase + i * 2;
        const d = r * (1.25 + i * .18);
        const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * .45;
        ctx.fillStyle = p.palette[3]; ctx.beginPath(); ctx.arc(x, y, 4 + i * 2, 0, Math.PI * 2); ctx.fill();
      }
    }
    document.querySelector('#explore').addEventListener('click', explore);
    document.querySelector('#random').addEventListener('click', randomSeed);
    seedInput.addEventListener('keydown', e => { if (e.key === 'Enter') explore(); });
    temperature.addEventListener('input', updateReadout);
    seedInput.value = new URLSearchParams(location.search).get('seed') || seedInput.value;
    explore(); requestAnimationFrame(draw);
  </script>
</body>
</html>
