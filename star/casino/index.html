<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAR CASINO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/casino.css">
  <link rel="icon" href="/shared/favicon.png" type="image/png">
</head>
<body>
  <div id="casino-root"></div>

  <script type="module">
    import { getUser }    from '../../js/supabase.js';
    import { CasinoCore } from './js/casino-core.js';

    (async () => {
      // Auth guard — redirige vers login si pas connecté
      const user = await getUser();
      if (!user) { window.location.href = '/login.html'; return; }

      const casino = await CasinoCore.boot({
        mount:      '#casino-root',
        userId:     user.id,
        standalone: true,
      });

      casino.showLobby();
    })();
  </script>
</body>
</html>
