<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MON ESPACE — Gwen Ha Star</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/theme.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/star.css"/>
  <style>
    .star-page { min-height:100dvh; display:flex; flex-direction:column; background:var(--c-bg); }
    .star-main { flex:1; max-width:1300px; width:100%; margin:0 auto; padding:var(--space-4) var(--space-4) var(--space-4); padding-bottom: calc(var(--space-16) + 56px); }

    /* ── STATUS BAR ── */
    .status-bar {
      display:flex; align-items:center; justify-content:space-between;
      gap:var(--space-4); padding:var(--space-2) var(--space-5);
      background:var(--c-surface); border-bottom:1px solid var(--c-border);
      font-family:var(--font-mono); font-size:9px; letter-spacing:.16em;
      color:var(--c-text-muted); position:sticky; top:0; z-index:200;
      backdrop-filter:blur(8px);
    }
    .sb-left  { display:flex; align-items:center; gap:var(--space-5); }
    .sb-right { display:flex; align-items:center; gap:var(--space-4); }
    .sb-item  { display:flex; align-items:center; gap:5px; }
    .sb-dot   { width:6px; height:6px; border-radius:50%; background:var(--c-primary); box-shadow:var(--glow-green); animation:blink 2s ease-in-out infinite; flex-shrink:0; }
    .sb-dot.amber { background:var(--c-amber); box-shadow:var(--glow-amber); }
    .sb-dot.red   { background:var(--c-red);   box-shadow:var(--glow-red); animation-duration:1s; }
    .sb-dot.off   { background:var(--c-text-faint); box-shadow:none; animation:none; }
    .sb-clock { color:var(--c-primary); font-size:10px; font-variant-numeric:tabular-nums; }
    .sb-user  { color:var(--c-cyan); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    /* ── BOTTOM NAV ── */
    #star-header-user {
      position:fixed; bottom:0; left:0; right:0; z-index:300;
      background:var(--c-surface); border-top:1px solid var(--c-border);
      backdrop-filter:blur(12px); padding:0 var(--space-5); height:56px;
      display:flex; align-items:center;
    }
    #star-header-user .star-user-info { display:flex; align-items:center; gap:var(--space-3); flex-shrink:0; }
    #star-header-user .star-avatar { width:32px; height:32px; border-radius:50%; background:var(--c-surface-2); border:1px solid var(--c-primary); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
    #star-header-user .star-avatar img { width:100%; height:100%; object-fit:cover; }
    #star-header-user .star-avatar-initials { font-family:var(--font-display); font-size:var(--text-sm); color:var(--c-primary); font-weight:700; }
    #star-header-user .star-user-meta { display:flex; flex-direction:column; gap:1px; }
    #star-header-user .star-username { font-family:var(--font-display); font-size:var(--text-sm); font-weight:700; color:var(--c-text); line-height:1.1; }
    #star-header-user .star-rang { font-family:var(--font-mono); font-size:8px; letter-spacing:.14em; color:var(--c-amber); }
    #star-header-user .star-header-nav { display:flex; align-items:center; gap:var(--space-1); margin-left:var(--space-5); flex:1; }
    #star-header-user .star-nav-link { font-family:var(--font-mono); font-size:9px; letter-spacing:.14em; color:var(--c-text-muted); text-decoration:none; padding:var(--space-2) var(--space-3); border:1px solid transparent; border-radius:var(--radius-sm); transition:all .18s; white-space:nowrap; }
    #star-header-user .star-nav-link:hover { color:var(--c-text); border-color:var(--c-border); }
    #star-header-user .star-nav-ext { color:var(--c-cyan); }
    #star-header-user .star-signout-btn { margin-left:auto; flex-shrink:0; font-family:var(--font-mono); font-size:9px; letter-spacing:.14em; color:var(--c-red); border:1px solid transparent; border-radius:var(--radius-sm); padding:var(--space-2) var(--space-3); transition:all .18s; }
    #star-header-user .star-signout-btn:hover { border-color:var(--c-red); background:color-mix(in oklch,var(--c-red) 10%,transparent); }
    @media(max-width:600px) { #star-header-user .star-header-nav .star-nav-ext { display:none; } #star-header-user .star-header-nav .star-nav-link { padding:var(--space-2); font-size:8px; } }

    /* ── WELCOME STRIP ── */
    .welcome-strip { display:flex; align-items:center; gap:var(--space-4); padding:var(--space-5) var(--space-6); background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius-xl); margin:var(--space-4) 0 var(--space-5); position:relative; overflow:hidden; }
    .welcome-strip::after { content:""; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--c-primary),var(--c-cyan),var(--c-amber),var(--c-purple)); background-size:300% 100%; animation:slide-bar 6s linear infinite; }
    @keyframes slide-bar { 0%{background-position:300% 0} 100%{background-position:-300% 0} }
    .w-avatar { width:50px; height:50px; border-radius:50%; border:2px solid var(--c-primary); background:var(--c-surface-2); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:var(--text-xl); font-weight:700; color:var(--c-primary); flex-shrink:0; overflow:hidden; box-shadow:var(--glow-primary); }
    .w-avatar img { width:100%; height:100%; object-fit:cover; }
    .w-info { flex:1; min-width:0; }
    .w-tag  { font-family:var(--font-mono); font-size:9px; letter-spacing:.2em; color:var(--c-primary); opacity:.7; }
    .w-name { font-family:var(--font-display); font-size:var(--text-xl); font-weight:700; color:var(--c-text); line-height:1.1; }
    .w-role { font-family:var(--font-mono); font-size:9px; letter-spacing:.15em; color:var(--c-amber); margin-top:2px; }
    .w-actions { display:flex; gap:var(--space-2); flex-shrink:0; }
    @media(max-width:600px){ .w-actions { display:none } }

    /* ── KPI ── */
    .kpi-strip { display:grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap:var(--space-3); margin-bottom:var(--space-5); }
    .kpi { background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius-lg); padding:var(--space-4) var(--space-5); display:flex; flex-direction:column; gap:2px; position:relative; overflow:hidden; }
    .kpi::after { content:""; position:absolute; bottom:0; left:0; right:0; height:1px; background:var(--kpi-c, var(--c-primary)); opacity:.6; }
    .kpi-lbl { font-family:var(--font-mono); font-size:9px; letter-spacing:.18em; color:var(--c-text-muted); }
    .kpi-val { font-family:var(--font-display); font-size:var(--text-xl); line-height:1; color:var(--kpi-c, var(--c-primary)); text-shadow:0 0 18px var(--kpi-c, var(--c-primary)); }
    .kpi-sub { font-family:var(--font-mono); font-size:8px; letter-spacing:.1em; color:var(--c-text-faint); }

    /* ── BENTO ── */
    .bento { display:grid; grid-template-columns: repeat(12, 1fr); gap:var(--space-4); }
    .bc { background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius-xl); padding:var(--space-5); overflow:hidden; position:relative; }
    .bc-label { display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:9px; letter-spacing:.2em; color:var(--c-primary); opacity:.65; margin-bottom:var(--space-3); }
    .bc-dot { width:5px; height:5px; border-radius:50%; background:currentColor; }
    .bc-qa       { grid-column: span 12; }
    .bc-pg       { grid-column: span 5;  }
    .bc-gaming   { grid-column: span 7;  }
    .bc-activity { grid-column: span 4;  }
    .bc-radio    { grid-column: span 8;  }
    @media(max-width:1100px) { .bc-pg, .bc-gaming, .bc-activity, .bc-radio { grid-column: span 12; } }

    /* ── QUICK ACCESS ── */
    #quick-access-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(175px,1fr)); gap:var(--space-3); }
    .qa-card { display:flex; flex-direction:column; gap:var(--space-1); padding:var(--space-4); background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:var(--radius-lg); text-decoration:none; color:var(--c-text); transition:border-color .18s, box-shadow .18s, background .18s; position:relative; overflow:hidden; }
    .qa-card::before { content:""; position:absolute; top:0; left:0; right:0; height:2px; background:var(--qa-color,var(--c-primary)); }
    .qa-card:hover { border-color:var(--qa-color,var(--c-primary)); box-shadow:0 0 18px color-mix(in oklch,var(--qa-color,var(--c-primary)) 25%,transparent); background:var(--c-surface); }
    .qa-icon  { font-size:1.3rem; color:var(--qa-color,var(--c-primary)); }
    .qa-label { font-family:var(--font-display); font-weight:700; font-size:var(--text-base); }
    .qa-desc  { font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; color:var(--c-text-muted); }
    .qa-ext   { position:absolute; top:var(--space-3); right:var(--space-3); font-size:9px; color:var(--c-text-faint); }
    .widget-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:var(--space-10) var(--space-4); text-align:center; color:var(--c-text-muted); }
    .widget-empty-icon { font-size:1.8rem; margin-bottom:var(--space-3); opacity:.3; }
    .widget-empty p    { font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; }

    /* ── POKEGANG GANG CARD ── */
    .pg-card {
      display:flex; flex-direction:column; gap:var(--space-4); height:100%;
    }
    .pg-card-header {
      display:flex; align-items:center; gap:var(--space-4);
      padding:var(--space-4) var(--space-5);
      background:var(--c-surface-2); border:1px solid var(--c-border);
      border-radius:var(--radius-lg); position:relative; overflow:hidden;
    }
    .pg-card-header::before {
      content:""; position:absolute; inset:0;
      background:radial-gradient(ellipse at top left, color-mix(in oklch,var(--c-amber) 8%,transparent) 0%, transparent 65%);
      pointer-events:none;
    }
    .pg-logo {
      width:52px; height:52px; border-radius:var(--radius-md);
      border:1px solid var(--c-border); overflow:hidden;
      background:var(--c-surface); flex-shrink:0; display:flex; align-items:center; justify-content:center;
    }
    .pg-logo img { width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
    .pg-logo-svg { width:36px; height:36px; }
    .pg-header-info { flex:1; min-width:0; }
    .pg-title { font-family:var(--font-display); font-size:var(--text-lg); font-weight:700; color:var(--c-amber); line-height:1.1; letter-spacing:.04em; }
    .pg-subtitle { font-family:var(--font-mono); font-size:8px; letter-spacing:.2em; color:var(--c-text-muted); margin-top:2px; }
    .pg-online-badge { display:flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:8px; letter-spacing:.14em; color:var(--c-primary); margin-top:var(--space-2); }
    .pg-online-dot { width:5px; height:5px; border-radius:50%; background:var(--c-primary); box-shadow:var(--glow-green); animation:blink 2s ease-in-out infinite; }

    .pg-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); flex:1;
    }
    .pg-stat-card {
      background:var(--c-surface-2); border:1px solid var(--c-border);
      border-radius:var(--radius-md); padding:var(--space-3) var(--space-4);
      display:flex; flex-direction:column; gap:2px;
    }
    .pg-stat-card.full { grid-column: span 2; }
    .pg-stat-lbl { font-family:var(--font-mono); font-size:8px; letter-spacing:.16em; color:var(--c-text-faint); }
    .pg-stat-val { font-family:var(--font-display); font-size:var(--text-lg); line-height:1.1; color:var(--c-amber); }
    .pg-stat-sub { font-family:var(--font-mono); font-size:8px; color:var(--c-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .pg-gang-row {
      display:flex; align-items:center; gap:var(--space-3);
      background:var(--c-surface-2); border:1px solid var(--c-border);
      border-radius:var(--radius-md); padding:var(--space-3) var(--space-4);
    }
    .pg-boss-sprite { width:44px; height:44px; object-fit:contain; image-rendering:pixelated; flex-shrink:0; }
    .pg-gang-info { flex:1; min-width:0; }
    .pg-gang-name { font-family:var(--font-display); font-size:var(--text-base); font-weight:700; color:var(--c-amber); }
    .pg-boss-name { font-family:var(--font-mono); font-size:8px; letter-spacing:.12em; color:var(--c-text-muted); }

    .pg-cta {
      display:flex; align-items:center; justify-content:center; gap:var(--space-3);
      padding:var(--space-3) var(--space-5);
      background:linear-gradient(135deg, color-mix(in oklch,var(--c-amber) 15%,var(--c-surface-2)), var(--c-surface-2));
      border:1px solid color-mix(in oklch,var(--c-amber) 40%,var(--c-border));
      border-radius:var(--radius-lg);
      color:var(--c-amber); text-decoration:none;
      font-family:var(--font-display); font-weight:700; font-size:var(--text-base);
      letter-spacing:.06em; transition:all .2s;
      box-shadow:0 0 0 transparent;
      margin-top:auto;
    }
    .pg-cta:hover {
      background:linear-gradient(135deg, color-mix(in oklch,var(--c-amber) 25%,var(--c-surface)), var(--c-surface));
      border-color:var(--c-amber);
      box-shadow:0 0 20px color-mix(in oklch,var(--c-amber) 25%,transparent);
      transform:translateY(-1px);
    }
    .pg-cta:active { transform:translateY(0); }
    .pg-cta-logo { width:22px; height:22px; object-fit:contain; image-rendering:pixelated; flex-shrink:0; }
    .pg-cta-arrow { font-size:.9rem; opacity:.7; }
    .pg-no-data { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:var(--space-2); text-align:center; padding:var(--space-6) 0; }
    .pg-no-data-icon { font-size:1.5rem; opacity:.2; }
    .pg-no-data-txt { font-family:var(--font-mono); font-size:9px; letter-spacing:.14em; color:var(--c-text-faint); }

    /* ── GAMING PANEL ── */
    .gaming-panel { display:flex; flex-direction:column; gap:var(--space-3); height:100%; }
    .gaming-tabs  { display:flex; gap:var(--space-2); }
    .g-tab { flex:1; padding:var(--space-2) var(--space-3); background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:var(--radius-md); cursor:pointer; font-family:var(--font-mono); font-size:9px; letter-spacing:.14em; color:var(--c-text-muted); transition:all .18s; text-align:center; }
    .g-tab.active { background:var(--tab-c,var(--c-primary)); border-color:var(--tab-c,var(--c-primary)); color:var(--c-bg); box-shadow:0 0 14px color-mix(in oklch,var(--tab-c,var(--c-primary)) 35%,transparent); }
    .g-tab:not(.active):hover { border-color:var(--tab-c,var(--c-border)); color:var(--c-text); }
    .g-pane { display:none; flex-direction:column; gap:var(--space-3); flex:1; }
    .g-pane.active { display:flex; }
    .g-id-row { display:flex; gap:var(--space-2); align-items:center; }
    .g-id-input { flex:1; background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:var(--radius-md); padding:var(--space-2) var(--space-3); font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; color:var(--c-text); outline:none; transition:border-color .18s; }
    .g-id-input::placeholder { color:var(--c-text-faint); }
    .g-id-input:focus { border-color:var(--c-primary); }
    .g-id-save { padding:var(--space-2) var(--space-3); background:var(--c-primary); border:none; border-radius:var(--radius-md); color:var(--c-bg); font-family:var(--font-mono); font-size:9px; letter-spacing:.12em; cursor:pointer; white-space:nowrap; transition:background .18s; box-shadow:var(--glow-green); }
    .g-id-save:hover { filter:brightness(1.1); }
    .g-id-save:disabled { opacity:.5; cursor:not-allowed; }
    .g-stats { display:flex; flex-direction:column; gap:var(--space-2); }
    .g-stat-row { display:flex; align-items:center; justify-content:space-between; padding:var(--space-2) var(--space-3); background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:var(--radius-md); }
    .g-stat-key { font-family:var(--font-mono); font-size:9px; letter-spacing:.12em; color:var(--c-text-muted); }
    .g-stat-val { font-family:var(--font-display); font-size:var(--text-base); color:var(--g-c,var(--c-amber)); }
    .g-rank-badge { display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3) var(--space-4); background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:var(--radius-lg); }
    .g-rank-emblem { width:44px; height:44px; object-fit:contain; flex-shrink:0; }
    .g-rank-icon   { font-size:1.6rem; flex-shrink:0; }
    .g-rank-info   { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
    .g-rank-tier   { font-family:var(--font-display); font-size:var(--text-base); color:var(--g-c,var(--c-amber)); font-weight:700; }
    .g-rank-lp     { font-family:var(--font-mono); font-size:8px; letter-spacing:.12em; color:var(--c-text-muted); }
    .g-refresh-btn { margin-left:auto; padding:var(--space-1) var(--space-2); background:transparent; border:1px solid var(--c-border); border-radius:var(--radius-sm); color:var(--c-text-faint); font-family:var(--font-mono); font-size:8px; letter-spacing:.1em; cursor:pointer; transition:all .18s; flex-shrink:0; }
    .g-refresh-btn:hover { border-color:var(--c-primary); color:var(--c-primary); }
    .g-refresh-btn:disabled { opacity:.4; cursor:not-allowed; }
    .g-refresh-btn.spin { animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .g-champs { display:flex; gap:var(--space-2); flex-wrap:wrap; }
    .g-champ { display:flex; align-items:center; gap:5px; padding:3px var(--space-2); background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:8px; letter-spacing:.08em; color:var(--c-text-muted); }
    .g-champ img { width:20px; height:20px; border-radius:2px; }
    .g-cache-info { font-family:var(--font-mono); font-size:8px; letter-spacing:.1em; color:var(--c-text-faint); margin-top:auto; padding-top:var(--space-1); display:flex; align-items:center; justify-content:space-between; }
    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    .g-skeleton { background:linear-gradient(90deg,var(--c-surface-2) 25%,var(--c-surface-offset,#1d1c1a) 50%,var(--c-surface-2) 75%); background-size:200% 100%; animation:shimmer 1.4s ease-in-out infinite; border-radius:var(--radius-sm); height:12px; }
    .g-links { display:flex; gap:var(--space-2); flex-wrap:wrap; }
    .g-link { font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; color:var(--c-cyan); text-decoration:none; display:inline-flex; align-items:center; gap:3px; padding:var(--space-1) var(--space-2); border:1px solid var(--c-border); border-radius:var(--radius-sm); transition:all .18s; }
    .g-link:hover { border-color:var(--c-cyan); background:var(--c-surface-2); }
    .g-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:var(--space-2); text-align:center; padding:var(--space-6) 0; }
    .g-empty-icon { font-size:1.5rem; opacity:.25; }
    .g-empty-txt  { font-family:var(--font-mono); font-size:9px; letter-spacing:.14em; color:var(--c-text-faint); }

    /* ── ACTIVITY + RADIO ── */
    .activity-feed { list-style:none; display:flex; flex-direction:column; }
    .activity-item { display:grid; grid-template-columns:1.1rem 1fr auto; align-items:baseline; gap:var(--space-2); padding:var(--space-2) 0; border-bottom:1px solid var(--c-divider); font-size:var(--text-sm); }
    .activity-item:last-child { border-bottom:none; }
    .activity-icon { color:var(--c-primary); font-size:.85rem; }
    .activity-text { color:var(--c-text); }
    .activity-time { font-family:var(--font-mono); font-size:8px; color:var(--c-text-faint); white-space:nowrap; }
    .radio-player  { display:flex; flex-direction:column; gap:var(--space-3); }
    .radio-top     { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); flex-wrap:wrap; }
    .radio-status  { display:flex; align-items:center; gap:var(--space-2); }
    .radio-led     { width:8px; height:8px; border-radius:50%; background:var(--c-text-faint); transition:background .3s; }
    .radio-led.active { background:var(--c-primary); box-shadow:var(--glow-green); animation:blink 1.5s ease-in-out infinite; }
    .radio-station { font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; color:var(--c-text); }
    .radio-select  { background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:var(--radius-sm); color:var(--c-text); font-family:var(--font-mono); font-size:10px; padding:var(--space-1) var(--space-2); cursor:pointer; }
    .radio-controls{ display:flex; align-items:center; gap:var(--space-4); }
    .radio-btn     { width:36px; height:36px; border-radius:50%; background:var(--c-primary); color:var(--c-bg); font-size:1rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:var(--glow-green); transition:box-shadow .18s; }
    .radio-btn:hover { box-shadow:var(--glow-primary); }
    .radio-vol-wrap { display:flex; align-items:center; gap:var(--space-2); flex:1; }
    .radio-vol-icon { font-size:.7rem; color:var(--c-text-muted); }
    .radio-vol { flex:1; accent-color:var(--c-primary); }

    /* ── CASINO MODAL ── */
    #casino-modal {
      display:none; position:fixed; inset:0; z-index:500;
      background:oklch(0 0 0 / .75); backdrop-filter:blur(6px);
      align-items:center; justify-content:center;
    }
    #casino-modal.open { display:flex; }
    .casino-box {
      background:var(--c-surface); border:1px solid var(--c-border);
      border-radius:var(--radius-xl); padding:var(--space-6);
      width:min(420px, 92vw); position:relative; overflow:hidden;
      box-shadow:0 0 40px color-mix(in oklch,var(--c-amber) 20%,transparent);
    }
    .casino-box::before {
      content:""; position:absolute; top:0; left:0; right:0; height:2px;
      background:linear-gradient(90deg,var(--c-amber),var(--c-red),var(--c-purple),var(--c-amber));
      background-size:300% 100%; animation:slide-bar 3s linear infinite;
    }
    .casino-title {
      font-family:var(--font-display); font-size:var(--text-xl); font-weight:700;
      color:var(--c-amber); letter-spacing:.08em; text-align:center;
      margin-bottom:var(--space-5); text-shadow:0 0 20px var(--c-amber);
    }
    .casino-close {
      position:absolute; top:var(--space-4); right:var(--space-4);
      font-family:var(--font-mono); font-size:10px; letter-spacing:.12em;
      color:var(--c-text-muted); border:1px solid var(--c-border);
      border-radius:var(--radius-sm); padding:3px var(--space-2);
      cursor:pointer; transition:all .18s;
    }
    .casino-close:hover { color:var(--c-red); border-color:var(--c-red); }

    /* Rouleaux */
    .slots-machine {
      display:flex; gap:var(--space-3); justify-content:center;
      margin-bottom:var(--space-5);
    }
    .slot-reel {
      width:90px; height:90px; border-radius:var(--radius-lg);
      background:var(--c-bg); border:2px solid var(--c-border);
      display:flex; align-items:center; justify-content:center;
      font-size:2.6rem; overflow:hidden; position:relative;
      transition:border-color .2s;
    }
    .slot-reel.spinning {
      border-color:var(--c-amber);
      animation:reel-shake .08s linear infinite;
    }
    @keyframes reel-shake {
      0%  { transform:translateY(-2px); }
      50% { transform:translateY(2px); }
      100%{ transform:translateY(-2px); }
    }
    .slot-reel.win { border-color:var(--c-amber); box-shadow:0 0 24px color-mix(in oklch,var(--c-amber) 40%,transparent); }
    .slot-reel.lose { border-color:var(--c-red); }
    .slot-symbol { font-size:2.6rem; line-height:1; user-select:none; }

    /* Résultat */
    .casino-result {
      text-align:center; font-family:var(--font-mono); font-size:11px;
      letter-spacing:.16em; min-height:28px; margin-bottom:var(--space-4);
      color:var(--c-text-muted); transition:color .3s;
    }
    .casino-result.win-msg  { color:var(--c-amber); text-shadow:0 0 12px var(--c-amber); }
    .casino-result.lose-msg { color:var(--c-red); }

    /* Jetons */
    .casino-credits {
      display:flex; align-items:center; justify-content:center; gap:var(--space-3);
      margin-bottom:var(--space-5);
    }
    .credit-lbl { font-family:var(--font-mono); font-size:9px; letter-spacing:.2em; color:var(--c-text-faint); }
    .credit-val { font-family:var(--font-display); font-size:var(--text-xl); color:var(--c-amber); text-shadow:0 0 12px var(--c-amber); font-variant-numeric:tabular-nums; }

    /* Bouton SPIN */
    .casino-spin-btn {
      display:block; width:100%;
      padding:var(--space-3) var(--space-5);
      background:linear-gradient(135deg, color-mix(in oklch,var(--c-amber) 20%,var(--c-surface-2)), var(--c-surface-2));
      border:1px solid color-mix(in oklch,var(--c-amber) 50%,var(--c-border));
      border-radius:var(--radius-lg);
      color:var(--c-amber); font-family:var(--font-display); font-weight:700;
      font-size:var(--text-base); letter-spacing:.1em; cursor:pointer;
      transition:all .2s; box-shadow:0 0 0 transparent;
      margin-bottom:var(--space-3);
    }
    .casino-spin-btn:hover:not(:disabled) {
      background:linear-gradient(135deg, color-mix(in oklch,var(--c-amber) 30%,var(--c-surface)), var(--c-surface));
      border-color:var(--c-amber);
      box-shadow:0 0 24px color-mix(in oklch,var(--c-amber) 30%,transparent);
    }
    .casino-spin-btn:disabled { opacity:.4; cursor:not-allowed; }

    /* Table des gains */
    .casino-paytable {
      display:grid; grid-template-columns:1fr 1fr; gap:4px 12px;
      padding:var(--space-3) var(--space-4);
      background:var(--c-surface-2); border:1px solid var(--c-border);
      border-radius:var(--radius-md); font-family:var(--font-mono); font-size:8px;
      letter-spacing:.1em; color:var(--c-text-faint);
    }
    .casino-paytable span:nth-child(odd)  { color:var(--c-text-muted); }
    .casino-paytable span:nth-child(even) { color:var(--c-amber); text-align:right; }
  </style>
</head>
