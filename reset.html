<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RESET MDP — Gwen Ha Star</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/theme.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100dvh; }
    .wrap { width:100%; max-width:420px; padding:var(--space-4); }
    .card {
      background:var(--c-surface); border:1px solid var(--c-border);
      border-radius:var(--radius-xl); padding:var(--space-8);
    }
    .tag { font-family:var(--font-mono); font-size:9px; letter-spacing:0.2em; color:var(--c-green-d); margin-bottom:var(--space-2); }
    h1 { font-family:var(--font-display); font-size:var(--text-xl); font-weight:700; color:var(--c-text); margin-bottom:var(--space-6); }
    p.desc { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--c-text-muted); letter-spacing:0.06em; margin-bottom:var(--space-6); max-width:none; }
    .form-group { display:flex; flex-direction:column; gap:var(--space-2); margin-bottom:var(--space-4); }
    label { font-family:var(--font-mono); font-size:var(--text-xs); letter-spacing:0.1em; color:var(--c-text-muted); }
    input[type="email"] {
      background:var(--c-surface-2); border:1px solid var(--c-border);
      border-radius:var(--radius-md); padding:var(--space-3) var(--space-4);
      font-family:var(--font-mono); font-size:var(--text-sm); color:var(--c-text); width:100%;
      transition:border-color 180ms ease;
    }
    input:focus { outline:none; border-color:var(--c-primary); box-shadow:0 0 0 3px var(--c-primary-hl); }
    .btn {
      display:flex; align-items:center; justify-content:center;
      width:100%; padding:var(--space-3) var(--space-6); margin-top:var(--space-4);
      background:var(--c-primary); color:var(--c-text-inv); border:none;
      border-radius:var(--radius-md); font-family:var(--font-mono);
      font-size:var(--text-sm); letter-spacing:0.1em; cursor:pointer;
      transition:all 180ms ease;
    }
    .btn:hover { background:var(--c-primary-h); box-shadow:var(--glow-primary); transform:translateY(-1px); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .msg { display:none; margin-top:var(--space-4); padding:var(--space-3) var(--space-4); border-radius:var(--radius-md); font-family:var(--font-mono); font-size:var(--text-xs); letter-spacing:0.05em; }
    .msg.success { display:block; background:rgba(0,255,136,0.08); border:1px solid rgba(0,255,136,0.25); color:var(--c-green); }
    .msg.error   { display:block; background:rgba(255,71,87,0.08);  border:1px solid rgba(255,71,87,0.25);  color:var(--c-red); }
    .back { display:block; text-align:center; margin-top:var(--space-6); font-family:var(--font-mono); font-size:var(--text-xs); color:var(--c-text-faint); text-decoration:none; letter-spacing:0.08em; }
    .back:hover { color:var(--c-primary); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="tag">// RESET · MDP</p>
      <h1>MOT DE PASSE</h1>
      <p class="desc">Saisis ton email — tu recevras un lien de réinitialisation.</p>
      <form id="reset-form" novalidate>
        <div class="form-group">
          <label for="email">EMAIL</label>
          <input type="email" id="email" placeholder="agent@sterenna.fr" required/>
        </div>
        <button type="submit" class="btn" id="submit-btn">→ ENVOYER LE LIEN</button>
        <div class="msg" id="msg" role="alert"></div>
      </form>
      <a href="/login.html" class="back">← Retour connexion</a>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js';
    const form = document.getElementById('reset-form');
    const btn  = document.getElementById('submit-btn');
    const msg  = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      btn.disabled = true;
      btn.textContent = '...';
      msg.className = 'msg';

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/update-password.html',
      });

      if (error) {
        msg.textContent = '⚠ ' + error.message;
        msg.className = 'msg error';
      } else {
        msg.textContent = '✓ Lien envoyé — vérifie ta boîte mail.';
        msg.className = 'msg success';
      }
      btn.disabled = false;
      btn.textContent = '→ ENVOYER LE LIEN';
    });
  </script>
</body>
</html>
