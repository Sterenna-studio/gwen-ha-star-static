# Dependabot — mises à jour de dépendances automatisées.
# Stack détecté : site statique (HTML/CSS/JS/TS) sans package manager.
# → Seul l'écosystème "github-actions" est activé.
#
# ➕ Quand un manifeste sera ajouté, décommenter/ajouter l'entrée correspondante :
#   - package.json / lockfile Node  → package-ecosystem: "npm"
#   - requirements.txt / pyproject  → package-ecosystem: "pip"
#   - Dockerfile / compose          → package-ecosystem: "docker"
# En monorepo, dupliquer l'entrée avec le bon "directory" par sous-projet.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Les sous-actions github/codeql-action/* partagent obligatoirement le même
    # SHA : une PR par sous-action casse la parité de version et fait échouer
    # l'analyse ("Loaded a configuration file for version X, but running Y").
    # Le groupe force dependabot à les bumper ensemble dans une seule PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
      - "security"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

