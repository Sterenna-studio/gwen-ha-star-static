name: Deploy nitro-clicker to OVH

on:
  repository_dispatch:
    types: [nitro-clicker-updated]
  workflow_dispatch:

concurrency:
  group: deploy-nitro-clicker-ovh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nitro-clicker
        uses: actions/checkout@v4
        with:
          repository: sterenna-studio/nitro-clicker
          path: _tmp

      - name: Inject shared runtime config
        run: |
          mkdir -p _tmp/shared
          python3 - <<'PY'
          import os
          from pathlib import Path
          url  = os.environ['GHSTAR_SUPABASE_URL']
          anon = os.environ['GHSTAR_SUPABASE_ANON']
          Path('_tmp/shared/config.js').write_text(
            '// Runtime config — generated by GitHub Actions.\n'
            '// Do not commit this file.\n\n'
            f"export const SUPABASE_URL = {url!r};\n"
            f"export const SUPABASE_ANON = {anon!r};\n",
            encoding='utf-8'
          )
          PY
        env:
          GHSTAR_SUPABASE_URL: ${{ secrets.GHSTAR_SUPABASE_URL }}
          GHSTAR_SUPABASE_ANON: ${{ secrets.GHSTAR_SUPABASE_ANON }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OVH_SSH_KEY }}" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -H "${{ secrets.OVH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote dir
        run: |
          ssh -i ~/.ssh/ovh_key "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}" \
            "mkdir -p ~/nitro/clicker"

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.example' \
            -e "ssh -i ~/.ssh/ovh_key" \
            _tmp/ "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:~/nitro/clicker/"
