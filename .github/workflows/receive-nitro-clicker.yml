name: Receive nitro-clicker sync

on:
  repository_dispatch:
    types: [sync-nitro-clicker]
  workflow_dispatch:

concurrency:
  group: gwen-static-main-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gwen-ha-star-static
        uses: actions/checkout@v4

      - name: Checkout nitro-clicker (public)
        uses: actions/checkout@v4
        with:
          repository: sterenna-studio/nitro-clicker
          path: _nitro_clicker_tmp

      - name: Copy files to subfolder
        run: |
          rm -rf clicker
          mkdir -p clicker
          cp -r _nitro_clicker_tmp/. clicker/
          rm -rf clicker/.git
          rm -rf clicker/.github
          rm -f clicker/.env clicker/.env.example
          rm -rf _nitro_clicker_tmp
          ls -la clicker/

      - name: Commit + push avec retry rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clicker/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: sync nitro-clicker into clicker/ [auto]"
          for i in 1 2 3 4 5; do
            if git push; then echo "Push OK (tentative $i)"; exit 0; fi
            echo "Push rejeté (tentative $i) — rebase..."
            git pull --rebase origin main
          done
          exit 1
