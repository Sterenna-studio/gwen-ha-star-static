# ═══════════════════════════════════════════════════════════════════════════
#  Test — spec runner natif (node:test) sur la logique pure du repo.
#  Zéro dépendance (package.json n'a aucun devDependency) : le runner intégré
#  à Node suffit. Actions épinglées par SHA (# vX) — maintenues par Dependabot.
# ═══════════════════════════════════════════════════════════════════════════
name: Test

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (node:test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Run tests
        run: npm test
