name: Receive botanica-obscura sync

on:
  repository_dispatch:
    types: [sync-botanica-obscura]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gwen-ha-star-static
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Checkout botanica-obscura
        uses: actions/checkout@v4
        with:
          repository: MutenRock/botanica-obscura
          token: ${{ secrets.SYNC_TOKEN }}
          path: _botanica_tmp

      - name: Copy files to subfolder
        run: |
          rm -rf botanica-obscura
          mkdir -p botanica-obscura
          rsync -av --exclude='.git' --exclude='.env*' --exclude='README.md' _botanica_tmp/ botanica-obscura/
          rm -rf _botanica_tmp

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add botanica-obscura/
          git diff --staged --quiet || git commit -m "chore: sync botanica-obscura [auto]"
          git push
