name: Deploy Gwen Ha Star to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-gwen-ha-star-ovh
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site to OVH via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate shared runtime config
        env:
          GHSTAR_SUPABASE_URL: ${{ secrets.GHSTAR_SUPABASE_URL }}
          GHSTAR_SUPABASE_ANON: ${{ secrets.GHSTAR_SUPABASE_ANON }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          url = os.environ.get('GHSTAR_SUPABASE_URL', '')
          anon = os.environ.get('GHSTAR_SUPABASE_ANON', '')

          if not url or not anon:
              raise SystemExit('Missing GHSTAR_SUPABASE_URL or GHSTAR_SUPABASE_ANON repository secret')

          target = Path('shared/config.js')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              '// Runtime config generated by GitHub Actions during deployment.\n'
              '// Do not commit this file.\n\n'
              f"export const SUPABASE_URL = {url!r};\n"
              f"export const SUPABASE_ANON = {anon!r};\n",
              encoding='utf-8',
          )
          PY

      - name: Add deployment marker
        run: |
          echo "Gwen Ha Star deploy" > deploy-test.txt
          echo "Commit: $GITHUB_SHA" >> deploy-test.txt
          echo "Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> deploy-test.txt

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OVH_SSH_KEY }}" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -H "${{ secrets.OVH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote target directory exists
        run: |
          ssh -i ~/.ssh/ovh_key "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}" "mkdir -p ~/nitro"

      - name: Deploy to OVH with rsync
        run: |
          rsync -avz --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            --exclude='/docs/' \
            --exclude='/arena/' \
            --exclude='/skill-arena/' \
            --exclude='/dedale/' \
            --exclude='/clicker/' \
            --exclude='/TCG/' \
            --exclude='/titan-rocket-run/' \
            --exclude='/botanica/' \
            --exclude='/goetia/' \
            --exclude='/ARCHITECTURE.md' \
            -e "ssh -i ~/.ssh/ovh_key" \
            ./ "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:~/nitro/"

      - name: Smoke test public deployment
        env:
          GHSTAR_PUBLIC_URL: ${{ vars.GHSTAR_PUBLIC_URL || 'https://nitro.sterenna.fr' }}
        run: |
          set -euo pipefail
          BASE_URL="${GHSTAR_PUBLIC_URL%/}"
          paths=(
            "/"
            "/css/home.css"
            "/css/home-public.css"
            "/css/home-radio.css"
            "/css/home-utilities.css"
            "/js/home.js"
            "/js/space-background.js"
            "/js/chronicles-fm-widget.js"
            "/shared/supabase-client.js"
            "/jukebox/chronicles-fm.json"
          )

          for path in "${paths[@]}"; do
            url="$BASE_URL$path"
            echo "Checking $url"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "$url" > /dev/null
          done

          echo "Smoke tests passed for $BASE_URL"
