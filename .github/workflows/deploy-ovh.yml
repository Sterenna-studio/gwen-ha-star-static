name: Deploy Gwen Ha Star to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-gwen-ha-star-ovh
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site to OVH via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate shared runtime config
        env:
          GHSTAR_SUPABASE_URL: ${{ secrets.GHSTAR_SUPABASE_URL }}
          GHSTAR_SUPABASE_ANON: ${{ secrets.GHSTAR_SUPABASE_ANON }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          url = os.environ.get('GHSTAR_SUPABASE_URL', '')
          anon = os.environ.get('GHSTAR_SUPABASE_ANON', '')

          if not url or not anon:
              raise SystemExit('Missing GHSTAR_SUPABASE_URL or GHSTAR_SUPABASE_ANON repository secret')

          target = Path('shared/config.js')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              '// Runtime config generated by GitHub Actions during deployment.\n'
              '// Do not commit this file.\n\n'
              f"export const SUPABASE_URL = {url!r};\n"
              f"export const SUPABASE_ANON = {anon!r};\n",
              encoding='utf-8',
          )
          PY

      - name: Add deployment marker
        run: |
          echo "Gwen Ha Star deploy" > deploy-test.txt
          echo "Commit: $GITHUB_SHA" >> deploy-test.txt
          echo "Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> deploy-test.txt

      - name: Generate terminal-safe 3615 feed
        run: node scripts/build-3615-feed.mjs

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OVH_SSH_KEY }}" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -H "${{ secrets.OVH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote target directory exists
        run: |
          ssh -i ~/.ssh/ovh_key "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}" "mkdir -p ~/nitro"

      - name: Deploy to OVH with rsync
        run: |
          rsync -avz --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            --exclude='/docs/' \
            --exclude='/arena/' \
            --exclude='/skill-arena/' \
            --exclude='/dedale/' \
            --exclude='/clicker/' \
            --exclude='/corebots/' \
            --exclude='/TCG/' \
            --exclude='/bzh-universe/' \
            --exclude='/titan-rocket-run/' \
            --exclude='/botanica/' \
            --exclude='/geotia/' \
            --exclude='/goetia/' \
            --exclude='/ARCHITECTURE.md' \
            -e "ssh -i ~/.ssh/ovh_key" \
            ./ "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:~/nitro/"

      - name: Smoke test public deployment
        env:
          GHSTAR_PUBLIC_URL: ${{ vars.GHSTAR_PUBLIC_URL || 'https://nitro.sterenna.fr' }}
        run: |
          set -euo pipefail
          BASE_URL="${GHSTAR_PUBLIC_URL%/}"
          paths=(
            "/"
            "/prod/"
            "/versions/themes/"
            "/versions/background-presets/"
            "/css/home.css"
            "/css/home-public.css"
            "/css/home-radio.css"
            "/css/home-utilities.css"
            "/css/home-sections.css"
            "/prod/css/home.css"
            "/versions/themes/css/theme.css"
            "/versions/background-presets/js/space-preset-switcher.js"
            "/js/home.js"
            "/js/home-sections-runtime.js"
            "/js/space-background.js"
            "/js/chronicles-fm-widget.js"
            "/shared/supabase-client.js"
            "/jukebox/chronicles-fm.json"
            "/data/3615-feed.json"
            "/data/lemegeton-state.json"
          )

          for path in "${paths[@]}"; do
            url="$BASE_URL$path"
            echo "Checking $url"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "$url" > /dev/null
          done

          echo "Smoke tests passed for $BASE_URL"

      - name: Publish Star activity git push
        env:
          GHSTAR_SUPABASE_URL: ${{ secrets.GHSTAR_SUPABASE_URL }}
          GHSTAR_SUPABASE_SERVICE_ROLE: ${{ secrets.GHSTAR_SUPABASE_SERVICE_ROLE }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = os.environ.get('GHSTAR_SUPABASE_URL', '').rstrip('/')
          key = os.environ.get('GHSTAR_SUPABASE_SERVICE_ROLE', '')

          if not url or not key:
              print('Star activity git_push skipped: missing GHSTAR_SUPABASE_URL or GHSTAR_SUPABASE_SERVICE_ROLE')
              raise SystemExit(0)

          repo = os.environ.get('GITHUB_REPOSITORY', 'Sterenna-studio/gwen-ha-star-static')
          branch = os.environ.get('GITHUB_REF_NAME', 'main')
          commit = os.environ.get('GITHUB_SHA', '')
          actor = os.environ.get('GITHUB_ACTOR', 'github-actions')

          payload = {
              'event_type': 'git_push',
              'channel': 'crew',
              'audience': 'crew',
              'message': f"Push git {repo}:{branch} · {commit[:7]} deploy OK",
              'actor': actor,
              'role': 'automation',
              'source': 'github-actions.deploy-ovh',
              'repo': repo,
              'branch': branch,
              'commit': commit,
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
          }

          body = json.dumps({
              'type': 'git_push',
              'payload': payload,
              'user_id': None,
          }).encode('utf-8')

          request = urllib.request.Request(
              f'{url}/rest/v1/activity_log',
              data=body,
              method='POST',
              headers={
                  'apikey': key,
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
                  'Prefer': 'return=minimal',
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(f'Star activity git_push published: HTTP {response.status}')
          except (urllib.error.URLError, urllib.error.HTTPError) as exc:
              print(f'Star activity git_push warning: {exc}')
          PY
