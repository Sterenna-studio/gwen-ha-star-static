# ═══════════════════════════════════════════════════════════════════════════
#  Security — scans supply-chain / vulnérabilités / secrets
#  Non destructif : indépendant de deploy-ovh.yml. Aucun de ces jobs ne
#  déploie ni ne bloque le déploiement (workflows séparés).
#
#  TODO durcissement : épingler les actions par SHA de commit plutôt que par
#  tag de version (ex: uses: actions/checkout@<sha> # v4). Dependabot
#  (github-actions) proposera les bumps. Les tags @vX ci-dessous sont des tags
#  de version stables (jamais de branche flottante @main/@master).
# ═══════════════════════════════════════════════════════════════════════════
name: Security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 4 * * 1" # lundi 04:17 UTC
  workflow_dispatch:

# Lecture seule par défaut ; chaque job élargit au strict nécessaire.
permissions: read-all

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Détection du stack : conditionne les jobs d'audit ────────────────────
  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      node_lock: ${{ steps.d.outputs.node_lock }}
      pkg_manager: ${{ steps.d.outputs.pkg_manager }}
      python: ${{ steps.d.outputs.python }}
      has_manifest: ${{ steps.d.outputs.has_manifest }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: |
          node_lock=false; pkg=none; python=false; has_manifest=false
          if [ -f package-lock.json ]; then node_lock=true; pkg=npm; fi
          if [ -f pnpm-lock.yaml ];  then node_lock=true; pkg=pnpm; fi
          if [ -f yarn.lock ];       then node_lock=true; pkg=yarn; fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then python=true; fi
          # Manifeste = ce qui alimente le dependency graph GitHub
          if [ -f package.json ] || [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f go.mod ]; then
            has_manifest=true
          fi
          {
            echo "node_lock=$node_lock"
            echo "pkg_manager=$pkg"
            echo "python=$python"
            echo "has_manifest=$has_manifest"
          } >> "$GITHUB_OUTPUT"
          echo "Detected → node_lock=$node_lock pkg=$pkg python=$python manifest=$has_manifest"

  # ── Revue des dépendances ajoutées dans une PR ───────────────────────────
  # Conditionnée à la présence d'un manifeste : sans dependency graph il n'y a
  # rien à réviser (skip propre sur un repo statique). Nécessite aussi que le
  # "Dependency graph" soit activé côté repo (Settings → Code security).
  dependency-review:
    name: Dependency review
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.has_manifest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  # ── Scan de secrets (historique complet) ─────────────────────────────────
  # On utilise le BINAIRE gitleaks directement (et non gitleaks/gitleaks-action)
  # car cette action exige une licence pour les repos d'organisation. Le binaire
  # n'a pas cette contrainte : self-contained, version épinglée, sans secret.
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.18.4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan git history
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --verbose

  # ── Scan filesystem : vulnérabilités + secrets + misconfig → SARIF ───────
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF vers l'onglet Security
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          exit-code: "0" # rapport non bloquant → résultats dans l'onglet Security
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true # tolère un repo sans code scanning activé
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  # ── Audit Node : seulement si un lockfile Node existe ────────────────────
  node-audit:
    name: Node dependency audit
    needs: detect
    if: needs.detect.outputs.node_lock == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Enable corepack (pnpm/yarn)
        run: corepack enable
      - name: Audit (npm)
        if: needs.detect.outputs.pkg_manager == 'npm'
        run: |
          npm ci
          npm audit --audit-level=moderate
      - name: Audit (pnpm)
        if: needs.detect.outputs.pkg_manager == 'pnpm'
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level moderate
      - name: Audit (yarn)
        if: needs.detect.outputs.pkg_manager == 'yarn'
        run: |
          corepack prepare yarn@stable --activate
          yarn install --immutable
          # Yarn Berry : npm audit ; fallback classic si besoin.
          yarn npm audit --severity moderate || yarn audit --level moderate

  # ── Audit Python : seulement si requirements.txt / pyproject.toml ────────
  python-audit:
    name: Python dependency audit
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            pip-audit
          fi
