name: Sync skill-arena submodule

on:
  repository_dispatch:
    types: [skill-arena-updated]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout avec submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Update skill-arena to latest
        run: git submodule update --remote skill-arena

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skill-arena
          git diff --staged --quiet || git commit -m "chore: sync skill-arena submodule [auto]"
          git push
