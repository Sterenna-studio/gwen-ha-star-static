name: Sync skill-arena submodule

on:
  repository_dispatch:
    types: [skill-arena-updated]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sans submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configurer git avec PAT pour les submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Init et update submodule skill-arena
        run: |
          git submodule update --init --remote skill-arena

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skill-arena
          git diff --staged --quiet || git commit -m "chore: sync skill-arena submodule [auto]"
          git push
