name: Sync skill-arena submodule

on:
  repository_dispatch:
    types: [skill-arena-updated]
  workflow_dispatch:

concurrency:
  group: gwen-static-main-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sans submodules
        uses: actions/checkout@v6

      - name: Init et update submodule skill-arena (public)
        run: |
          git submodule update --init --remote skill-arena

      - name: Commit + push avec retry rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skill-arena
          if git diff --staged --quiet; then
            echo "Aucun changement de submodule, rien à pousser."
            exit 0
          fi
          git commit -m "chore: sync skill-arena submodule [auto]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push réussi à la tentative $i"
              exit 0
            fi
            echo "Push rejeté (tentative $i) — rebase puis retry..."
            git pull --rebase origin main
          done
          echo "Échec du push après 5 tentatives"
          exit 1
