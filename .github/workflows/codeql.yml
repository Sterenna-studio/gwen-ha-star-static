# ═══════════════════════════════════════════════════════════════════════════
#  CodeQL — analyse statique de sécurité (JavaScript / TypeScript)
#
#  Le repo est du JS/TS pur (pas de build) → un seul langage, pas de matrice
#  qui échouerait sur un langage absent.
#
#  ⚠️ Ce workflow "advanced" et le "CodeQL default setup" (Settings → Security)
#  sont MUTUELLEMENT EXCLUSIFS. Si tu préfères le default setup en un clic,
#  supprime ce fichier. Ne pas activer les deux.
#
#  Actions épinglées par SHA (# vX) — maintenues par Dependabot (voir security.yml).
# ═══════════════════════════════════════════════════════════════════════════
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "27 3 * * 1" # lundi 03:27 UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload des résultats CodeQL
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          category: "/language:javascript-typescript"
