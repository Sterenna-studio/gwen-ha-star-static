<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Audio — Gwen Ha Star</title>
<style>
:root{
  --bg:#06090f;--panel:#0d1420;--border:#1a2840;
  --purple:#8b5cf6;--blue:#00d4ff;--red:#e94560;
  --green:#00ff9d;--amber:#f59e0b;--yellow:#fde68a;
  --text:#c8d8e8;--dim:#4a6a8a;
  --mono:'Share Tech Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:.82rem;min-height:100vh;}

/* HEADER */
.adm-header{display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;
  border-bottom:1px solid var(--border);background:rgba(13,20,32,.95);
  position:sticky;top:0;z-index:100;}
.adm-logo{color:var(--red);letter-spacing:.25em;font-size:.9rem;
  text-shadow:0 0 10px rgba(233,69,96,.4);}
.adm-sub{color:var(--dim);font-size:.65rem;letter-spacing:.15em;}
.adm-dot{width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 6px var(--green);animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* LAYOUT */
.adm-main{display:grid;grid-template-columns:220px 1fr;gap:0;min-height:calc(100vh - 57px);}

/* SIDEBAR */
.adm-sidebar{border-right:1px solid var(--border);padding:1.2rem 0;}
.adm-nav-title{padding:.3rem 1.2rem;font-size:.58rem;letter-spacing:.2em;color:var(--dim);margin-bottom:.3rem;}
.adm-nav-btn{display:flex;align-items:center;gap:.6rem;width:100%;padding:.55rem 1.2rem;
  background:none;border:none;color:var(--dim);cursor:pointer;font-family:var(--mono);
  font-size:.74rem;letter-spacing:.06em;transition:background .12s;text-align:left;}
.adm-nav-btn:hover{background:rgba(139,92,246,.07);color:var(--text);}
.adm-nav-btn.active{background:rgba(139,92,246,.13);color:var(--purple);
  border-left:2px solid var(--purple);}
.adm-nav-icon{font-size:1rem;width:1.3rem;text-align:center;}

/* CONTENT */
.adm-content{padding:1.5rem 2rem;}
.adm-section{display:none;}
.adm-section.active{display:block;}
.adm-section-title{font-size:.9rem;letter-spacing:.18em;color:var(--purple);
  margin-bottom:1.2rem;padding-bottom:.5rem;
  border-bottom:1px solid var(--border);}

/* CARDS GRILLE */
.adm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;}

/* AUDIO CARD */
.audio-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:1rem;display:flex;flex-direction:column;gap:.7rem;
  transition:border-color .15s;}
.audio-card:hover{border-color:rgba(139,92,246,.4);}
.audio-card.has-file{border-color:rgba(0,255,157,.25);}
.audio-card.has-file .ac-status{color:var(--green);}
.ac-head{display:flex;align-items:flex-start;gap:.6rem;}
.ac-icon{font-size:1.2rem;flex-shrink:0;margin-top:.1rem;}
.ac-info{flex:1;min-width:0;}
.ac-filename{font-size:.7rem;color:var(--blue);letter-spacing:.08em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ac-text{font-size:.72rem;color:var(--text);line-height:1.5;font-style:italic;
  opacity:.85;margin-top:.3rem;}
.ac-status{font-size:.6rem;letter-spacing:.12em;color:var(--dim);margin-top:.2rem;}

/* PLAYER INLINE */
.ac-player{display:flex;align-items:center;gap:.5rem;}
.ac-player audio{flex:1;height:28px;min-width:0;
  accent-color:var(--purple);filter:opacity(.9);}
.ac-play-btn{
  background:none;border:1px solid var(--border);color:var(--dim);
  border-radius:3px;padding:.2rem .45rem;cursor:pointer;font-size:.85rem;
  transition:all .15s;flex-shrink:0;}
.ac-play-btn:hover{border-color:var(--purple);color:var(--purple);}
.ac-play-btn.playing{border-color:var(--green);color:var(--green);}

/* UPLOAD ZONE */
.ac-upload{position:relative;}
.ac-upload input[type=file]{display:none;}
.ac-upload label{display:flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.4rem;border:1px dashed var(--border);border-radius:4px;
  cursor:pointer;color:var(--dim);font-size:.65rem;letter-spacing:.1em;
  transition:all .15s;}
.ac-upload label:hover{border-color:var(--purple);color:var(--purple);background:rgba(139,92,246,.06);}
.ac-upload.dragging label{border-color:var(--purple);background:rgba(139,92,246,.12);color:var(--purple);}
.ac-upload.uploading label{border-color:var(--amber);color:var(--amber);cursor:wait;}
.ac-upload.done label{border-color:var(--green);color:var(--green);}
.ac-upload.error label{border-color:var(--red);color:var(--red);}

/* PROGRESS */
.ac-progress{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:.3rem;display:none;}
.ac-progress.visible{display:block;}
.ac-progress-bar{height:100%;background:var(--purple);width:0;transition:width .2s;}

/* STATS BAR */
.adm-stats{display:flex;gap:1.5rem;margin-bottom:1.5rem;padding:1rem;
  background:var(--panel);border:1px solid var(--border);border-radius:6px;}
.stat-item{display:flex;flex-direction:column;gap:.2rem;}
.stat-val{font-size:1.4rem;color:var(--purple);letter-spacing:.05em;}
.stat-lbl{font-size:.58rem;color:var(--dim);letter-spacing:.15em;}

/* TOAST */
#adm-toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;
  background:var(--panel);border:1px solid var(--purple);border-radius:6px;
  padding:.7rem 1.1rem;font-size:.74rem;letter-spacing:.06em;
  opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;}
#adm-toast.show{opacity:1;transform:translateY(0);}
#adm-toast.success{border-color:var(--green);color:var(--green);}
#adm-toast.error{border-color:var(--red);color:var(--red);}

@media(max-width:700px){
  .adm-main{grid-template-columns:1fr;}
  .adm-sidebar{border-right:none;border-bottom:1px solid var(--border);
    display:flex;flex-wrap:wrap;padding:.5rem;gap:.3rem;}
  .adm-nav-title{display:none;}
  .adm-nav-btn{border-left:none!important;padding:.4rem .7rem;border-radius:4px;}
  .adm-content{padding:1rem;}
}
</style>
</head>
<body>

<!-- HEADER -->

<div class="adm-main">

<script>

    { file:'glitch.mp3',         text:'Effet glitch visuel',             base:'fx' },
    { file:'cfm-tune-in.mp3',    text:'Sélection fréquence radio',      base:'fx' },
    { file:'cfm-static.mp3',     text:'Transition fréquences (bruit blanc)', base:'fx' },
    { file:'cfm-play.mp3',       text:'Lancement lecture',               base:'fx' },
    { file:'cfm-skip.mp3',       text:'Skip piste',                      base:'fx' },
    { file:'cfm-night-on.mp3',   text:'Activation mode nuit',            base:'fx' },
    { file:'cfm-leme-appear.mp3',text:'Apparition LemePanel (crackle)',  base:'fx' },
  ],
};

const BASE_LEME = '/audio/leme/';
const BASE_FX   = '/audio/fx/';

function audioBase(section, item) {
  return (section === 'fx' || (item && item.base === 'fx')) ? BASE_FX : BASE_LEME;
}

/* ──────────────────────────────────────────────────────── SECTION NAV */
function showSection(id, btn) {
  document.querySelectorAll('.adm-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.adm-nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + id).classList.add('active');
  btn.classList.add('active');
}

/* ──────────────────────────────────────────────────────── TOAST */
let toastTimer;
function toast(msg, type) {
  const el = document.getElementById('adm-toast');
  el.textContent = msg;
  el.className = 'show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 3000);
}

/* ──────────────────────────────────────────────────────── CHECK FILE */
async function checkFile(url) {
  try {
    const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    return r.ok;
  } catch { return false; }
}

/* ──────────────────────────────────────────────────────── BUILD CARD */
function buildCard(section, item) {
  const base     = audioBase(section, item);
  const url      = base + item.file;
  const card     = document.createElement('div');
  card.className = 'audio-card';
  card.id        = 'card-' + item.file.replace(/\./g,'_');

  const icon = section === 'intro'   ? '&#128640;'
             : section === 'ambient' ? '&#128225;'
             : section === 'night'   ? '&#127761;'
             : section === 'freq'    ? '&#128251;'
             : '&#128266;';

  const freqBadge = item.freq ? `<span style="font-size:.58rem;letter-spacing:.12em;color:var(--amber);display:block;margin-top:.15rem">${item.freq}</span>` : '';

  card.innerHTML = `
    <div class="ac-head">
      <span class="ac-icon">${icon}</span>
      <div class="ac-info">
        <div class="ac-filename">${item.file}</div>
        ${freqBadge}
        <div class="ac-text">${item.text}</div>
        <div class="ac-status" id="status-${item.file.replace(/\./g,'_')}">Vérification...</div>
      </div>
    </div>
    <div class="ac-player" id="player-${item.file.replace(/\./g,'_')}" style="display:none">
      <button class="ac-play-btn" title="Écouter">▶</button>
      <audio src="${url}" preload="none"></audio>
    </div>
    <div class="ac-upload" id="upload-${item.file.replace(/\./g,'_')}">
      <input type="file" id="file-${item.file.replace(/\./g,'_')}" accept="audio/mpeg,audio/ogg,audio/wav,.mp3,.ogg,.wav">
      <label for="file-${item.file.replace(/\./g,'_')}">↑ UPLOADER ${item.file}</label>
      <div class="ac-progress" id="prog-${item.file.replace(/\./g,'_')}"><div class="ac-progress-bar"></div></div>
    </div>`;

  return card;
}

/* ──────────────────────────────────────────────────────── PLAY BTN */
let currentAudio = null;
function bindPlayBtn(card, item, base) {
  const key   = item.file.replace(/\./g,'_');
  const pzone = card.querySelector('.ac-player');
  const btn   = pzone && pzone.querySelector('.ac-play-btn');
  const audio = pzone && pzone.querySelector('audio');
  if (!btn || !audio) return;
  btn.addEventListener('click', () => {
    if (currentAudio && currentAudio !== audio) { currentAudio.pause(); currentAudio.currentTime=0; }
    if (audio.paused) {
      audio.play().then(() => { btn.textContent='&#9646;&#9646;'; btn.classList.add('playing'); currentAudio=audio; })
        .catch(() => toast('Erreur lecture','error'));
    } else {
      audio.pause();
      btn.innerHTML='&#9654;'; btn.classList.remove('playing');
    }
    audio.onended = () => { btn.innerHTML='&#9654;'; btn.classList.remove('playing'); };
  });
}

/* ──────────────────────────────────────────────────────── UPLOAD */
function bindUpload(card, item, base) {
  const key    = item.file.replace(/\./g,'_');
  const input  = card.querySelector('#file-' + key);
  const uzone  = card.querySelector('#upload-' + key);
  const prog   = card.querySelector('#prog-' + key);
  const bar    = prog && prog.querySelector('.ac-progress-bar');
  const label  = uzone && uzone.querySelector('label');
  if (!input) return;

  // Drag & drop
  uzone.addEventListener('dragover', e => { e.preventDefault(); uzone.classList.add('dragging'); });
  uzone.addEventListener('dragleave', () => uzone.classList.remove('dragging'));
  uzone.addEventListener('drop', e => {
    e.preventDefault(); uzone.classList.remove('dragging');
    const f = e.dataTransfer.files[0];
    if (f) uploadFile(f, item, base, card, uzone, prog, bar, label);
  });

  input.addEventListener('change', () => {
    const f = input.files[0];
    if (f) uploadFile(f, item, base, card, uzone, prog, bar, label);
  });
}

async function uploadFile(file, item, base, card, uzone, prog, bar, label) {
  // Validation type
  if (!file.type.startsWith('audio/') && !file.name.match(/\.(mp3|ogg|wav)$/i)) {
    toast('Type non supporté (MP3/OGG/WAV)', 'error');
    return;
  }
  // Limite 20 Mo
  if (file.size > 20 * 1024 * 1024) {
    toast('Fichier trop lourd (max 20 Mo)', 'error');
    return;
  }

  uzone.classList.add('uploading');
  if (prog) prog.classList.add('visible');
  if (label) label.textContent = '\u23F3 Upload en cours…';

  // Supabase Storage upload via fetch
  // NOTE : remplace SUPABASE_URL et SUPABASE_ANON_KEY par les vraies valeurs
  // ou passe par une Edge Function dédiée pour ne pas exposer la service_role key
  const SUPABASE_URL  = window.SUPABASE_URL  || '';
  const SUPABASE_ANON = window.SUPABASE_ANON || '';
  const bucket        = 'audio';
  const folder        = base === BASE_FX ? 'fx' : 'leme';
  const path          = folder + '/' + item.file;

  if (!SUPABASE_URL) {
    // Fallback local : simule un upload (dev / test sans Supabase)
    await fakeProgress(bar);
    uzone.classList.remove('uploading');
    uzone.classList.add('done');
    if (label) label.textContent = '\u2713 ' + item.file + ' (simulation)';
    toast('Simulation OK — configure SUPABASE_URL', 'success');
    card.classList.add('has-file');
    setStatus(card, item.file, true);
    showPlayer(card, item.file, true);
    return;
  }

  try {
    const session = await getSupabaseSession();
    const token   = session ? session.access_token : SUPABASE_ANON;
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`);
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.setRequestHeader('Content-Type', file.type || 'audio/mpeg');
    xhr.setRequestHeader('x-upsert', 'true');
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && bar) bar.style.width = Math.round(e.loaded/e.total*100) + '%';
    };
    xhr.onload = () => {
      uzone.classList.remove('uploading');
      if (xhr.status >= 200 && xhr.status < 300) {
        uzone.classList.add('done');
        if (label) label.textContent = '\u2713 ' + item.file;
        toast(item.file + ' uploadé !', 'success');
        card.classList.add('has-file');
        setStatus(card, item.file, true);
        showPlayer(card, item.file, true);
      } else {
        uzone.classList.add('error');
        if (label) label.textContent = '\u2717 Erreur ' + xhr.status;
        toast('Erreur upload : ' + xhr.status, 'error');
      }
    };
    xhr.onerror = () => {
      uzone.classList.remove('uploading'); uzone.classList.add('error');
      if (label) label.textContent = '\u2717 Erreur réseau';
      toast('Erreur réseau', 'error');
    };
    xhr.send(file);
  } catch(e) {
    uzone.classList.remove('uploading'); uzone.classList.add('error');
    toast('Erreur : ' + e.message, 'error');
  }
}

function fakeProgress(bar) {
  return new Promise(resolve => {
    let p = 0;
    const t = setInterval(() => {
      p += Math.random() * 20;
      if (bar) bar.style.width = Math.min(p,95) + '%';
      if (p >= 95) { clearInterval(t); if (bar) bar.style.width='100%'; setTimeout(resolve,300); }
    }, 120);
  });
}

async function getSupabaseSession() {
  try {
    const raw = localStorage.getItem('sb-' + (window.SUPABASE_PROJECT_REF||'') + '-auth-token');
    if (raw) return JSON.parse(raw);
  } catch {}
  return null;
}

/* ──────────────────────────────────────────────────────── STATUS */
function setStatus(card, file, present) {
  const key = file.replace(/\./g,'_');
  const el  = card.querySelector('#status-' + key);
  if (el) { el.textContent = present ? '\u2713 FICHIER PRÉSENT' : '\u25a1 MANQUANT'; }
}

function showPlayer(card, file, show) {
  const key = file.replace(/\./g,'_');
  const el  = card.querySelector('#player-' + key);
  if (el) el.style.display = show ? 'flex' : 'none';
}

/* ──────────────────────────────────────────────────────── INIT */
async function initSection(section) {
  const items = AUDIO_DATA[section];
  const grid  = document.getElementById('grid-' + section);
  if (!grid || !items) return;
  grid.innerHTML = '';
  let present = 0;
  for (const item of items) {
    const base = audioBase(section, item);
    const card = buildCard(section, item);
    grid.appendChild(card);
    bindPlayBtn(card, item, base);
    bindUpload(card, item, base);
    // Check async
    checkFile(base + item.file + '?nc=' + Date.now()).then(ok => {
      if (ok) { present++; card.classList.add('has-file'); showPlayer(card,item.file,true); }
      setStatus(card, item.file, ok);
      updateStats();
    });
  }
}

let statCache = {};
function updateStats() {
  let total = 0, pres = 0;
  Object.values(AUDIO_DATA).forEach(arr => {
    total += arr.length;
    arr.forEach(item => {
      if (document.getElementById('card-' + item.file.replace(/\./g,'_'))?.classList.contains('has-file')) pres++;
    });
  });
  document.getElementById('stat-total').textContent   = total;
  document.getElementById('stat-present').textContent = pres;
  document.getElementById('stat-missing').textContent = total - pres;
}

async function init() {
  for (const section of ['intro','ambient','night','freq','fx']) {
    await initSection(section);
  }
}

init();
</script>
