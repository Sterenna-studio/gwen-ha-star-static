<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sterenna - Quizz</title>
    <link rel="stylesheet" href="css/hub.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Sterenna<span>Lab</span></div>
    </nav>
    <main class="container">
        <header class="hub-header">
            <h1>Espace Quizz</h1>
            <p>Sélectionnez un quiz disponible dans la base de données.</p>
        </header>

        <div class="quiz-grid" id="quiz-grid">
            <!-- Injecté via JS -->
            <div class="loading">Chargement des quiz...</div>
        </div>
    </main>

    <script>
        fetch('data/quizzes.json')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('quiz-grid');
                grid.innerHTML = '';
                data.forEach(q => {
                    grid.innerHTML += `
                        <div class="quiz-card">
                            <div class="tag">${q.theme}</div>
                            <h2>${q.title}</h2>
                            <p>${q.description}</p>
                            <a href="${q.path}" class="btn">Lancer le Quiz</a>
                        </div>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('quiz-grid').innerHTML = '<div class="error">Erreur de chargement de la base de données.</div>';
            });
    </script>
</body>
</html>
