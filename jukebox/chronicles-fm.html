<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronicles FM ✦ BZH Chronicles Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #080b12;
      --bg2:         #0d1220;
      --bg3:         #111827;
      --border:      #1e2d45;
      --neon-blue:   #00d4ff;
      --neon-purple: #8b5cf6;
      --neon-red:    #e94560;
      --neon-green:  #00ff9d;
      --neon-amber:  #f59e0b;
      --text:        #c8d8e8;
      --text-dim:    #5a7a9a;
      --text-bright: #e8f4ff;
      --card-bg:     #0a1020;
      --card-border: #1a2840;
      --font-mono:   'Share Tech Mono', monospace;
      --font-vt:     'VT323', monospace;
      --font-body:   'Special Elite', serif;
      --scanline-opacity: 0.04;
      --glow-blue:   0 0 8px rgba(0,212,255,.5), 0 0 20px rgba(0,212,255,.2);
      --glow-red:    0 0 8px rgba(233,69,96,.5),  0 0 20px rgba(233,69,96,.2);
      --glow-green:  0 0 8px rgba(0,255,157,.5),  0 0 20px rgba(0,255,157,.2);
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ═══════════════════════════════════════════
       SCANLINES + VIGNETTE
    ═══════════════════════════════════════════ */
    .scanlines {
      pointer-events: none;
      position: fixed; inset: 0; z-index: 9999;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,var(--scanline-opacity)) 2px,
        rgba(0,0,0,var(--scanline-opacity)) 4px
      );
    }
    .vignette {
      pointer-events: none;
      position: fixed; inset: 0; z-index: 9998;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.7) 100%);
    }

    /* ═══════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════ */
    .cfm-header {
      display: flex; align-items: center; gap: 1rem;
      padding: .8rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(8,11,18,.9);
      backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 100;
    }
    .cfm-logo {
      display: flex; align-items: center; gap: .6rem;
      color: var(--neon-red);
      font-family: var(--font-vt); font-size: 1.4rem;
      letter-spacing: .1em;
      text-shadow: var(--glow-red);
      flex: 1;
    }
    .cfm-logo .signal-dot {
      width: 8px; height: 8px;
      background: var(--neon-red);
      border-radius: 50%;
      box-shadow: var(--glow-red);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .cfm-back {
      color: var(--text-dim);
      text-decoration: none;
      font-size: .85rem;
      transition: color .2s;
    }
    .cfm-back:hover { color: var(--neon-blue); }
    .cfm-back-jk {
      color: var(--text-dim);
      text-decoration: none;
      font-size: .85rem;
      transition: color .2s;
    }
    .cfm-back-jk:hover { color: var(--neon-purple); }

    /* ═══════════════════════════════════════════
       HERO
    ═══════════════════════════════════════════ */
    .cfm-hero {
      padding: 3rem 1.5rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .cfm-hero::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 30% 50%, rgba(139,92,246,.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 70% 50%, rgba(0,212,255,.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .cfm-hero-title {
      font-family: var(--font-vt);
      font-size: clamp(3rem, 8vw, 6rem);
      color: var(--neon-red);
      text-shadow: var(--glow-red);
      letter-spacing: .15em;
      line-height: 1;
      animation: flicker 8s step-end infinite;
    }
    .cfm-hero-sub {
      font-family: var(--font-vt);
      font-size: clamp(1rem, 3vw, 1.5rem);
      color: var(--neon-blue);
      text-shadow: var(--glow-blue);
      letter-spacing: .2em;
      margin-top: .4rem;
    }
    .cfm-hero-intro {
      font-family: var(--font-body);
      font-size: .95rem;
      color: var(--text-dim);
      margin-top: 1rem;
      max-width: 540px;
      margin-left: auto; margin-right: auto;
      line-height: 1.6;
    }
    .cfm-lore {
      display: inline-block;
      margin-top: 1.2rem;
      padding: .4rem 1rem;
      border: 1px solid var(--neon-purple);
      border-radius: 2px;
      color: var(--neon-purple);
      font-size: .8rem;
      letter-spacing: .15em;
      font-family: var(--font-mono);
      animation: borderPulse 3s ease-in-out infinite;
    }

    /* ═══════════════════════════════════════════
       VUMÈTRE
    ═══════════════════════════════════════════ */
    .cfm-vu {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 3px;
      height: 28px;
      margin: 1.2rem auto 0;
      width: 120px;
    }
    .cfm-vu-bar {
      width: 5px;
      background: var(--neon-green);
      border-radius: 2px 2px 0 0;
      box-shadow: 0 0 4px var(--neon-green);
      animation: vu-anim var(--d, .6s) ease-in-out infinite alternate;
    }

    /* ═══════════════════════════════════════════
       NOW BROADCASTING
    ═══════════════════════════════════════════ */
    .cfm-now {
      margin: 2rem auto;
      max-width: 900px;
      padding: 0 1.5rem;
    }
    .cfm-section-label {
      font-size: .75rem;
      color: var(--neon-red);
      letter-spacing: .25em;
      margin-bottom: .8rem;
      display: flex; align-items: center; gap: .5rem;
    }
    .cfm-section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
    }
    .cfm-featured-card {
      background: linear-gradient(135deg, #0d1828 0%, #0a0f1e 100%);
      border: 1px solid var(--neon-purple);
      border-radius: 4px;
      padding: 1.5rem;
      box-shadow: 0 0 20px rgba(139,92,246,.15), inset 0 0 40px rgba(0,0,0,.3);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
    }
    @media (max-width: 600px) {
      .cfm-featured-card { grid-template-columns: 1fr; }
    }
    .cfm-featured-info .cfm-freq-id {
      font-size: .7rem;
      color: var(--neon-purple);
      letter-spacing: .2em;
      margin-bottom: .4rem;
    }
    .cfm-featured-info .cfm-freq-title {
      font-family: var(--font-vt);
      font-size: 1.6rem;
      color: var(--text-bright);
      line-height: 1.1;
    }
    .cfm-featured-info .cfm-freq-style {
      font-size: .8rem;
      color: var(--neon-blue);
      margin-top: .3rem;
      letter-spacing: .1em;
    }
    .cfm-featured-info .cfm-freq-desc {
      font-family: var(--font-body);
      font-size: .9rem;
      color: var(--text-dim);
      margin-top: .7rem;
      line-height: 1.6;
    }
    .cfm-featured-info .cfm-freq-mood {
      font-size: .75rem;
      color: var(--text-dim);
      margin-top: .5rem;
      font-style: italic;
    }
    .cfm-featured-embed {
      width: 280px;
      min-height: 160px;
      align-self: center;
    }
    @media (max-width: 600px) {
      .cfm-featured-embed { width: 100%; }
    }
    .cfm-featured-embed iframe {
      width: 100%;
      height: 160px;
      border: none;
      border-radius: 3px;
    }
    .cfm-sync-pending {
      background: var(--bg3);
      border: 1px dashed var(--border);
      border-radius: 3px;
      padding: 1rem;
      text-align: center;
      color: var(--text-dim);
      font-size: .8rem;
      letter-spacing: .1em;
    }
    .cfm-sync-pending .sync-icon { font-size: 1.4rem; display: block; margin-bottom: .4rem; }

    /* ═══════════════════════════════════════════
       FILTERS
    ═══════════════════════════════════════════ */
    .cfm-filters {
      max-width: 900px;
      margin: 2rem auto 0;
      padding: 0 1.5rem;
      display: flex; flex-wrap: wrap; gap: .5rem;
    }
    .cfm-filter-btn {
      padding: .3rem .8rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: .75rem;
      letter-spacing: .1em;
      cursor: pointer;
      border-radius: 2px;
      transition: all .15s;
    }
    .cfm-filter-btn:hover {
      border-color: var(--neon-blue);
      color: var(--neon-blue);
    }
    .cfm-filter-btn.active {
      border-color: var(--neon-purple);
      color: var(--neon-purple);
      background: rgba(139,92,246,.1);
      box-shadow: 0 0 6px rgba(139,92,246,.3);
    }

    /* ═══════════════════════════════════════════
       GRID FRÉQUENCES
    ═══════════════════════════════════════════ */
    .cfm-grid {
      max-width: 900px;
      margin: 1.5rem auto 3rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    /* ═══════════════════════════════════════════
       CARTE FRÉQUENCE
    ═══════════════════════════════════════════ */
    .cfm-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 1rem;
      display: flex; flex-direction: column; gap: .6rem;
      transition: border-color .2s, box-shadow .2s, transform .15s;
      position: relative;
      overflow: hidden;
    }
    .cfm-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent, var(--neon-blue)), transparent);
      opacity: 0;
      transition: opacity .2s;
    }
    .cfm-card:hover {
      border-color: var(--neon-blue);
      box-shadow: 0 0 12px rgba(0,212,255,.1);
      transform: translateY(-2px);
    }
    .cfm-card:hover::before { opacity: 1; }

    .cfm-card-status {
      font-size: .65rem;
      letter-spacing: .2em;
      display: flex; align-items: center; gap: .4rem;
    }
    .status-locked {
      color: var(--neon-green);
    }
    .status-locked .status-dot {
      width: 6px; height: 6px;
      background: var(--neon-green);
      border-radius: 50%;
      box-shadow: var(--glow-green);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .status-pending { color: var(--text-dim); }
    .status-pending .status-dot {
      width: 6px; height: 6px;
      background: var(--text-dim);
      border-radius: 50%;
    }

    .cfm-card-title {
      font-family: var(--font-vt);
      font-size: 1.1rem;
      color: var(--text-bright);
      line-height: 1.2;
    }
    .cfm-card-subtitle {
      font-size: .75rem;
      color: var(--neon-blue);
      letter-spacing: .08em;
    }
    .cfm-card-desc {
      font-family: var(--font-body);
      font-size: .82rem;
      color: var(--text-dim);
      line-height: 1.5;
      flex: 1;
    }
    .cfm-card-mood {
      font-size: .72rem;
      color: var(--text-dim);
      font-style: italic;
    }
    .cfm-card-tags {
      display: flex; flex-wrap: wrap; gap: .3rem;
    }
    .cfm-tag {
      padding: .15rem .5rem;
      background: rgba(139,92,246,.1);
      border: 1px solid rgba(139,92,246,.2);
      border-radius: 2px;
      font-size: .65rem;
      color: var(--neon-purple);
      letter-spacing: .08em;
    }

    .cfm-card-embed {
      border-radius: 3px;
      overflow: hidden;
    }
    .cfm-card-embed iframe {
      width: 100%; height: 140px;
      border: none;
      display: block;
    }

    .cfm-card-actions {
      display: flex; gap: .4rem; flex-wrap: wrap;
    }
    .cfm-btn {
      flex: 1;
      padding: .4rem .5rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: .7rem;
      letter-spacing: .08em;
      cursor: pointer;
      border-radius: 2px;
      transition: all .15s;
      min-width: 0;
      white-space: nowrap;
      text-decoration: none;
      text-align: center;
      display: inline-flex; align-items: center; justify-content: center; gap: .3rem;
    }
    .cfm-btn:hover:not(:disabled) {
      border-color: var(--neon-blue);
      color: var(--neon-blue);
    }
    .cfm-btn:disabled {
      opacity: .3;
      cursor: not-allowed;
    }
    .cfm-btn--yt:hover:not(:disabled) {
      border-color: #ff0000;
      color: #ff0000;
    }
    .cfm-btn--copy:hover:not(:disabled) {
      border-color: var(--neon-amber);
      color: var(--neon-amber);
    }
    .cfm-btn--copy.copied {
      border-color: var(--neon-green);
      color: var(--neon-green);
    }

    /* ═══════════════════════════════════════════
       ANIMATIONS
    ═══════════════════════════════════════════ */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }
    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96%           { opacity: .7; }
      97%           { opacity: 1; }
      98%           { opacity: .4; }
      99%           { opacity: 1; }
    }
    @keyframes borderPulse {
      0%, 100% { box-shadow: 0 0 4px rgba(139,92,246,.2); }
      50%      { box-shadow: 0 0 10px rgba(139,92,246,.5); }
    }
    @keyframes vu-anim {
      from { height: 4px; }
      to   { height: var(--h, 24px); }
    }

    /* ═══════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════ */
    @media (max-width: 480px) {
      .cfm-hero { padding: 2rem 1rem 1.5rem; }
      .cfm-filters, .cfm-grid, .cfm-now { padding: 0 1rem; }
    }
  </style>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette"  aria-hidden="true"></div>

  <!-- HEADER -->
  <header class="cfm-header">
    <div class="cfm-logo">
      <span class="signal-dot"></span>
      CHRONICLES FM
    </div>
    <a href="index.html" class="cfm-back-jk">⬤ JUKEBOX</a>
    <a href="../"        class="cfm-back">← NITRO</a>
  </header>

  <!-- HERO -->
  <section class="cfm-hero">
    <h1 class="cfm-hero-title">CHRONICLES FM</h1>
    <p  class="cfm-hero-sub">BZH CHRONICLES RADIO — LES FRÉQUENCES DU CODE</p>
    <p  class="cfm-hero-intro">Une radio-pirate captée entre les ruines du Code, les néons cyberpunk et les échos néo-bretons.</p>
    <span class="cfm-lore" id="cfm-lore">Signal pirate détecté dans les ruines du Code.</span>
    <div class="cfm-vu" aria-hidden="true" id="cfm-vu"></div>
  </section>

  <!-- NOW BROADCASTING -->
  <section class="cfm-now">
    <div class="cfm-section-label">▶ NOW BROADCASTING</div>
    <div id="cfm-featured"></div>
  </section>

  <!-- FILTRES -->
  <div class="cfm-filters" id="cfm-filters"></div>

  <!-- GRID -->
  <main class="cfm-grid" id="cfm-grid" aria-label="Fréquences Chronicles FM"></main>

  <script>
  (async () => {
    /* ── DATA ── */
    const res = await fetch('chronicles-fm.json');
    const playlists = await res.json();

    /* ── LORE ── */
    const lores = [
      'Signal pirate détecté dans les ruines du Code.',
      'Fréquence instable : ajustement du triskel numérique.',
      'Chronicles FM émet depuis une zone non cartographiée.',
      'Le Code écoute. Monte le volume.',
      'Transmission Dr.Spig en cours de décodage.',
      'Archive sonore du monde fracturé — accès autorisé.',
      'Synchronisation des fréquences en cours…'
    ];
    document.getElementById('cfm-lore').textContent =
      lores[Math.floor(Math.random() * lores.length)];

    /* ── VUMÈTRE ── */
    const vu = document.getElementById('cfm-vu');
    const heights = [8,14,22,18,26,12,20,16,24,10,18,22,14];
    const delays  = [0,.1,.2,.15,.3,.05,.25,.1,.35,.08,.18,.28,.12];
    heights.forEach((h, i) => {
      const b = document.createElement('div');
      b.className = 'cfm-vu-bar';
      b.style.setProperty('--h', h + 'px');
      b.style.setProperty('--d', (.4 + delays[i] * 2) + 's');
      b.style.animationDelay = delays[i] + 's';
      vu.appendChild(b);
    });

    /* ── HELPERS ── */
    const ytEmbed = (id) => {
      if (!id) return `<div class="cfm-sync-pending"><span class="sync-icon">📡</span>Fréquence en cours de synchronisation</div>`;
      return `<div class="cfm-card-embed"><iframe
        src="https://www.youtube.com/embed/videoseries?list=${id}&autoplay=0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
        title="Playlist YouTube"
        loading="lazy"
      ></iframe></div>`;
    };
    const ytLink = (id, full=false) =>
      id ? `https://www.youtube.com/playlist?list=${id}` : '';

    const statusBadge = (id) => id
      ? `<span class="cfm-card-status status-locked"><span class="status-dot"></span>SIGNAL LOCKED</span>`
      : `<span class="cfm-card-status status-pending"><span class="status-dot"></span>SYNC PENDING</span>`;

    const tagFilters = [
      { label: 'Tous',        value: 'all' },
      { label: 'Bass',        value: 'bass' },
      { label: 'Rave',        value: 'rave' },
      { label: 'Rap',         value: 'rap' },
      { label: 'Hyperpop',    value: 'hyperpop' },
      { label: 'Chill',       value: 'chill' },
      { label: 'OST',         value: 'ost' },
      { label: 'Rock',        value: 'rock' },
      { label: 'Folk',        value: 'folk' },
      { label: 'Weird',       value: 'weird' },
      { label: 'Long format', value: 'long format' },
    ];

    /* ── FEATURED ── */
    const featured = playlists.find(p => p.featured);
    if (featured) {
      const link = ytLink(featured.youtubePlaylistId);
      document.getElementById('cfm-featured').innerHTML = `
        <div class="cfm-featured-card">
          <div class="cfm-featured-info">
            ${statusBadge(featured.youtubePlaylistId)}
            <div class="cfm-freq-title">${featured.title}</div>
            <div class="cfm-freq-style">${featured.style}</div>
            <div class="cfm-freq-desc">${featured.description}</div>
            <div class="cfm-freq-mood">${featured.mood}</div>
          </div>
          <div class="cfm-featured-embed">
            ${featured.youtubePlaylistId
              ? `<iframe
                  src="https://www.youtube.com/embed/videoseries?list=${featured.youtubePlaylistId}&autoplay=0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen loading="lazy" title="${featured.title}"
                ></iframe>`
              : `<div class="cfm-sync-pending"><span class="sync-icon">📡</span>Fréquence en cours de synchronisation</div>`
            }
          </div>
        </div>`;
    }

    /* ── FILTERS ── */
    let activeFilter = 'all';
    const filterContainer = document.getElementById('cfm-filters');
    tagFilters.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'cfm-filter-btn' + (f.value === 'all' ? ' active' : '');
      btn.textContent = f.label;
      btn.dataset.filter = f.value;
      btn.addEventListener('click', () => {
        activeFilter = f.value;
        filterContainer.querySelectorAll('.cfm-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid();
      });
      filterContainer.appendChild(btn);
    });

    /* ── GRID ── */
    const grid = document.getElementById('cfm-grid');

    function renderGrid() {
      const filtered = activeFilter === 'all'
        ? playlists.filter(p => !p.featured)
        : playlists.filter(p => !p.featured && p.tags.includes(activeFilter));

      grid.innerHTML = '';
      if (!filtered.length) {
        grid.innerHTML = `<p style="color:var(--text-dim);grid-column:1/-1;text-align:center;padding:2rem;">Aucune fréquence sur ce canal.</p>`;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('article');
        card.className = 'cfm-card';
        const link = ytLink(p.youtubePlaylistId);
        const tagsHtml = p.tags.map(t => `<span class="cfm-tag">${t}</span>`).join('');

        card.innerHTML = `
          ${statusBadge(p.youtubePlaylistId)}
          <div class="cfm-card-title">${p.title}</div>
          <div class="cfm-card-subtitle">${p.style}</div>
          <div class="cfm-card-desc">${p.description}</div>
          <div class="cfm-card-mood">${p.mood}</div>
          <div class="cfm-card-tags">${tagsHtml}</div>
          ${ytEmbed(p.youtubePlaylistId)}
          <div class="cfm-card-actions">
            ${link
              ? `<a href="${link}" target="_blank" rel="noopener" class="cfm-btn cfm-btn--yt">▶ YouTube</a>`
              : `<button class="cfm-btn cfm-btn--yt" disabled>▶ YouTube</button>`
            }
            <button class="cfm-btn cfm-btn--copy" data-copy="${p.title}" title="Copier le nom">⎘ Copier</button>
          </div>`;

        card.querySelector('.cfm-btn--copy').addEventListener('click', (e) => {
          const btn = e.currentTarget;
          navigator.clipboard.writeText(btn.dataset.copy).then(() => {
            btn.classList.add('copied');
            btn.textContent = '✓ Copié';
            setTimeout(() => {
              btn.classList.remove('copied');
              btn.textContent = '⎘ Copier';
            }, 1500);
          });
        });

        grid.appendChild(card);
      });
    }

    renderGrid();
  })();
  </script>
</body>
</html>
