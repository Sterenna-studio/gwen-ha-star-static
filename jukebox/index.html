<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Sterenna – Jukebox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Fond de salle -->
  <div class="room-bg" aria-hidden="true"></div>

  <!-- Transition morphique -->
  <div id="themeMorph" class="morph hidden" aria-hidden="true"></div>

  <!-- Toggle thème -->
  <div class="theme-toggle">
    <button id="toSteam" class="toggle-btn active">☕ Vinyle</button>
    <button id="toCyber" class="toggle-btn">⚡ Cyber</button>
  </div>

  <!-- Corps principal du jukebox -->
  <div class="jukebox-body">

    <!-- ── TÊTE ── -->
    <div class="juke-head">
      <!-- Arche néon déco -->
      <div class="neon-arch" aria-hidden="true">
        <svg viewBox="0 0 1060 80" preserveAspectRatio="none">
          <defs>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path d="M0,80 Q530,0 1060,80" fill="none" stroke="#c8a96e" stroke-width="2" opacity="0.5" filter="url(#glow)"/>
          <path d="M40,80 Q530,10 1020,80" fill="none" stroke="#ff4fa3" stroke-width="1" opacity="0.3" filter="url(#glow)"/>
        </svg>
      </div>

      <!-- Titre -->
      <div class="juke-title">
        <div class="juke-title-main">STERENNA</div>
        <div class="juke-title-sub">JUKEBOX</div>
      </div>

      <!-- Affichage 7-seg -->
      <div class="neon-display">
        <div class="seg-label">NOW PLAYING</div>
        <div class="seg-text" id="nowPlaying">— Aucun disque chargé —</div>
      </div>
    </div>

    <!-- ── CENTRE : PLATINE | DÉCO | SÉLECTEUR ── -->
    <div class="juke-center">

      <!-- PANNEAU GAUCHE — Platine + contrôles -->
      <div class="juke-panel">
        <div class="panel-chrome-border">

          <!-- Platine -->
          <div class="turntable-section">
            <div class="platter-label">PLATINE</div>
            <div class="turntable">
              <div id="dropZone" class="platter dropzone">
                <div class="spindle"></div>
                <div class="vinyl on-deck effect-none" id="deckVinyl">
                  <div class="vinyl-art" id="deckArt"></div>
                </div>
                <!-- Bras de lecture -->
                <div class="tonearm" id="tonearm">
                  <div class="tonearm-pivot"></div>
                  <div class="tonearm-bar"></div>
                  <div class="tonearm-head"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Slot à monnaie (manivelle) -->
          <div class="coin-section">
            <div class="coin-slot-label">INSÉRER PIÈCE</div>
            <div class="coin-machine">
              <div class="coin-slot-housing" id="crank" title="Cliquer 5 fois pour lancer">
                <div class="coin-slot-opening"></div>
                <div class="coin-slot-shine"></div>
              </div>
              <div class="coin-gauge">
                <div class="coin-fill" id="crankFill"></div>
              </div>
              <div class="coin-hint" id="crankHint">0 / 5</div>
            </div>
          </div>

          <!-- Transport -->
          <div class="transport">
            <button id="prevBtn" class="transport-btn" aria-label="Précédent">⏮</button>
            <button id="playPause" class="transport-btn play-main" disabled aria-label="Lecture">▶</button>
            <button id="nextBtn" class="transport-btn" aria-label="Suivant">⏭</button>
            <button id="shuffleBtn" class="transport-btn" aria-label="Aléatoire">🔀</button>
            <label class="transport-btn volwrap" aria-label="Volume">
              🔊
              <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9" />
            </label>
          </div>

          <!-- Barre de temps -->
          <div class="timebar">
            <span class="time-display" id="curTime">0:00</span>
            <div class="seek-wrap" style="flex:1">
              <div class="seek-groove"></div>
              <input type="range" id="seek" min="0" max="100" value="0" />
            </div>
            <span class="time-display" id="durTime">0:00</span>
          </div>

          <audio id="player" preload="metadata" crossorigin="anonymous"></audio>
        </div>
      </div>

      <!-- COLONNE CENTRALE — Déco fenêtre -->
      <div class="juke-window" aria-hidden="true">
        <div class="window-glass">
          <div class="window-spin-disc" id="windowDisc"></div>
          <div class="window-grill">
            <div class="grill-line"></div>
            <div class="grill-line"></div>
            <div class="grill-line"></div>
            <div class="grill-line"></div>
          </div>
          <div class="window-label">STEREO</div>
        </div>
      </div>

      <!-- PANNEAU DROIT — Sélecteur de vinyles -->
      <div class="juke-panel">
        <div class="panel-chrome-border">
          <div class="selector-wrap">
            <div class="selector-header">
              <span class="selector-label">SÉLECTION</span>
              <div class="selector-arrows">
                <button class="sel-arrow" id="shelfPrev" aria-label="Précédent">‹</button>
                <button class="sel-arrow" id="shelfNext" aria-label="Suivant">›</button>
              </div>
            </div>
            <div class="shelf-iso" id="shelf" aria-label="Sélection de vinyles"></div>
            <div class="title-ticker" id="titleTicker">—</div>
            <div id="extractedSlot" class="extracted-slot"></div>
          </div>
        </div>
      </div>

    </div><!-- /.juke-center -->

    <!-- Pieds décoratifs -->
    <div class="juke-feet" aria-hidden="true">
      <div class="juke-foot"></div>
      <div class="juke-foot"></div>
    </div>

  </div><!-- /.jukebox-body -->

  <script src="js/app.js"></script>
</body>
</html>
