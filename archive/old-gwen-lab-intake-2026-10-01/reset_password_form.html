<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Définir un nouveau mot de passe • STERENNA</title>
  <link rel="stylesheet" href="../shared/cyberpunk.css">
</head>
<body>
  <div class="container">
    <h1>🔐 Nouveau mot de passe</h1>
    <div class="card">
      <label>Nouveau mot de passe :</label><br>
      <input type="password" id="new-password" placeholder="••••••••"><br>
      <button onclick="updatePassword()">✅ Valider</button>
      <p id="status"></p>
    </div>
  </div>

  <div class="nav">
    <a href="index.html">🏠 Accueil</a>
    <a href="profil.html">👤 Profil</a>
    <a href="modification_profil.html">✏️ Modifier</a>
    <a href="create_profile.html">🆕 Créer</a>
  </div>
  <style>
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #111;
      padding: 0.5rem;
      border-top: 2px solid #0ff;
      display: flex;
      justify-content: space-around;
      font-family: monospace;
      z-index: 1000;
    }
    .nav a {
      color: #0ff;
      text-decoration: none;
      font-weight: bold;
    }
    .nav a:hover {
      text-shadow: 0 0 5px #0ff;
    }
  </style>

  <script type="module">
    import { supabase } from '../shared/supabaseClient.js'

    async function updatePassword() {
      const newPassword = document.getElementById('new-password').value
      const { error } = await supabase.auth.updateUser({ password: newPassword })
      const status = document.getElementById('status')
      if (error) {
        status.innerText = "❌ " + error.message
      } else {
        status.innerText = "✅ Mot de passe mis à jour ! Redirection..."
        setTimeout(() => window.location.href = "profil.html", 1500)
      }
    }

    window.updatePassword = updatePassword
  </script>
</body>
</html>
