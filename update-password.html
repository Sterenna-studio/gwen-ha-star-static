<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NOUVEAU MDP — Gwen Ha Star</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/theme.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100dvh; }
    .wrap { width:100%; max-width:420px; padding:var(--space-4); }
    .card { background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius-xl); padding:var(--space-8); }
    .tag { font-family:var(--font-mono); font-size:9px; letter-spacing:0.2em; color:var(--c-green-d); margin-bottom:var(--space-2); }
    h1 { font-family:var(--font-display); font-size:var(--text-xl); font-weight:700; color:var(--c-text); margin-bottom:var(--space-6); }
    .form-group { display:flex; flex-direction:column; gap:var(--space-2); margin-bottom:var(--space-4); }
    label { font-family:var(--font-mono); font-size:var(--text-xs); letter-spacing:0.1em; color:var(--c-text-muted); }
    input[type="password"] {
      background:var(--c-surface-2); border:1px solid var(--c-border);
      border-radius:var(--radius-md); padding:var(--space-3) var(--space-4);
      font-family:var(--font-mono); font-size:var(--text-sm); color:var(--c-text); width:100%;
      transition:border-color 180ms ease;
    }
    input:focus { outline:none; border-color:var(--c-primary); box-shadow:0 0 0 3px var(--c-primary-hl); }
    .btn {
      display:flex; align-items:center; justify-content:center;
      width:100%; padding:var(--space-3) var(--space-6); margin-top:var(--space-4);
      background:var(--c-primary); color:var(--c-text-inv); border:none;
      border-radius:var(--radius-md); font-family:var(--font-mono);
      font-size:var(--text-sm); letter-spacing:0.1em; cursor:pointer;
      transition:all 180ms ease;
    }
    .btn:hover { background:var(--c-primary-h); transform:translateY(-1px); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .msg { display:none; margin-top:var(--space-4); padding:var(--space-3) var(--space-4); border-radius:var(--radius-md); font-family:var(--font-mono); font-size:var(--text-xs); }
    .msg.success { display:block; background:rgba(0,255,136,0.08); border:1px solid rgba(0,255,136,0.25); color:var(--c-green); }
    .msg.error   { display:block; background:rgba(255,71,87,0.08);  border:1px solid rgba(255,71,87,0.25);  color:var(--c-red); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="tag">// RESET · NOUVEAU MDP</p>
      <h1>NOUVEAU MOT DE PASSE</h1>
      <form id="update-form" novalidate>
        <div class="form-group">
          <label for="password">NOUVEAU MOT DE PASSE</label>
          <input type="password" id="password" placeholder="••••••••" required minlength="8"/>
        </div>
        <div class="form-group">
          <label for="confirm">CONFIRMER</label>
          <input type="password" id="confirm" placeholder="••••••••" required minlength="8"/>
        </div>
        <button type="submit" class="btn" id="submit-btn">→ METTRE À JOUR</button>
        <div class="msg" id="msg" role="alert"></div>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js';
    const form = document.getElementById('update-form');
    const btn  = document.getElementById('submit-btn');
    const msg  = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      msg.className  = 'msg';

      if (password !== confirm) {
        msg.textContent = '⚠ Les mots de passe ne correspondent pas.';
        msg.className = 'msg error';
        return;
      }
      btn.disabled = true;
      btn.textContent = '...';

      const { error } = await supabase.auth.updateUser({ password });
      if (error) {
        msg.textContent = '⚠ ' + error.message;
        msg.className = 'msg error';
      } else {
        msg.textContent = '✓ Mot de passe mis à jour — redirection...';
        msg.className = 'msg success';
        setTimeout(() => window.location.href = '/', 2000);
      }
      btn.disabled = false;
      btn.textContent = '→ METTRE À JOUR';
    });
  </script>
</body>
</html>
